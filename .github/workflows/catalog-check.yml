name: OpenCode catalogs

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
  push:
    branches:
      - main
      - dev
      - release/**
  merge_group:

permissions:
  contents: read

jobs:
  catalog-check:
    name: OpenCode catalog check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout checked commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"

      - name: Reject catalog drift
        run: npm run catalog:check
