# ONE-OFF VALIDATION ONLY: never merge this branch into main or dev.
name: Promote Release

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full SHA of an explicitly reviewed preparation merge into dev
        required: true
        type: string

permissions:
  contents: read

jobs:
  select:
    name: Select preparation merge
    if: github.repository == 'microsoft/aspire-skills' && github.ref == 'refs/heads/main' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      source: ${{ steps.select.outputs.source }}
    steps:
      - name: Checkout trusted main tooling
        # actions/checkout@v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: tooling
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        # actions/setup-node@v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"

      - name: Select exact preparation merge
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tooling/scripts/release.mjs select

  promote:
    name: Build promotion candidate
    if: github.repository == 'microsoft/aspire-skills' && github.ref == 'refs/heads/ellahathaway-one-off-release-validation' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.build.outputs.source }}
      base: ${{ steps.build.outputs.base }}
      version: ${{ steps.build.outputs.version }}
      candidate: ${{ steps.build.outputs.candidate }}
    steps:
      - name: Check release permissions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          for actor in "$ACTOR" "$TRIGGERING_ACTOR"; do
            if [[ -z "$actor" ]]; then
              echo "::error::A release actor is missing."
              exit 1
            fi
            if ! permission="$(gh api "repos/$REPOSITORY/collaborators/$actor/permission" --jq '.permission')"; then
              echo "::error::Unable to verify release permissions."
              exit 1
            fi
            case "$permission" in
              write|maintain|admin) ;;
              *)
                echo "::error::Both release actors must have write, maintain, or admin permission."
                exit 1
                ;;
            esac
          done

      - name: Require configured main approval
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! reviewers="$(gh api "repos/$REPOSITORY/environments/release-main" \
            --jq '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length > 0')"; then
            echo "::error::Configure the release-main environment with required reviewers before publishing."
            exit 1
          fi
          if [[ "$reviewers" != true ]]; then
            echo "::error::The release-main environment must require manual reviewer approval."
            exit 1
          fi

      - name: Checkout trusted tooling
        # actions/checkout@v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: tooling
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout candidate repository
        # actions/checkout@v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        # actions/setup-node@v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"

      - name: Fetch main and dev
        shell: bash
        env:
          RELEASE_REPO: ${{ github.workspace }}/candidate
        run: |
          set -euo pipefail
          if ! git -C "$RELEASE_REPO" fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/dev:refs/remotes/origin/dev; then
            echo "::error::Cannot fetch origin/main and origin/dev; both branches must exist."
            exit 1
          fi

      - name: Resolve source and version once
        id: resolve
        shell: bash
        env:
          RELEASE_REPO: ${{ github.workspace }}/candidate
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/tooling/scripts/release.mjs" resolve-promote

      - name: Test trusted tooling
        shell: bash
        working-directory: ${{ github.workspace }}/tooling
        run: npm test

      - name: Build and verify candidate
        id: build
        shell: bash
        env:
          RELEASE_REPO: ${{ github.workspace }}/candidate
          SOURCE_COMMIT: ${{ steps.resolve.outputs.source }}
          BASE_COMMIT: ${{ steps.resolve.outputs.base }}
          RELEASE_VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/tooling/scripts/release.mjs" promote

      - name: Summarize candidate
        shell: bash
        env:
          SUMMARY_PATH: ${{ github.workspace }}/candidate/dist/release/release-summary.md
        run: cat "$SUMMARY_PATH" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload checked release artifacts
        # actions/upload-artifact@v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: promote-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            candidate/dist/release/release.bundle
            candidate/dist/release/release-summary.md
            candidate/dist/release/release.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish approved release to main
    needs: promote
    if: github.repository == 'microsoft/aspire-skills' && github.ref == 'refs/heads/ellahathaway-one-off-release-validation' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: release-main
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    concurrency:
      group: publish-main
      cancel-in-progress: false
    outputs:
      commit: ${{ steps.push.outputs.commit }}
    steps:
      - name: Check release permissions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          for actor in "$ACTOR" "$TRIGGERING_ACTOR"; do
            if [[ -z "$actor" ]]; then
              echo "::error::A release actor is missing."
              exit 1
            fi
            if ! permission="$(gh api "repos/$REPOSITORY/collaborators/$actor/permission" --jq '.permission')"; then
              echo "::error::Unable to verify release permissions."
              exit 1
            fi
            case "$permission" in
              write|maintain|admin) ;;
              *)
                echo "::error::Both release actors must have write, maintain, or admin permission."
                exit 1
                ;;
            esac
          done

      - name: Checkout trusted tooling
        # actions/checkout@v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: tooling
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout receiver repository
        # actions/checkout@v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          path: receiver
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        # actions/setup-node@v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"

      - name: Download checked release artifact
        # actions/download-artifact@v4.3.0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: promote-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-artifact

      - name: Fetch main and dev
        shell: bash
        env:
          RELEASE_REPO: ${{ github.workspace }}/receiver
        run: |
          set -euo pipefail
          if ! git -C "$RELEASE_REPO" fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/dev:refs/remotes/origin/dev; then
            echo "::error::Cannot fetch origin/main and origin/dev; both branches must exist."
            exit 1
          fi

      - name: Receive and verify candidate
        id: verify
        shell: bash
        env:
          RELEASE_REPO: ${{ github.workspace }}/receiver
          SOURCE_COMMIT: ${{ needs.promote.outputs.source }}
          BASE_COMMIT: ${{ needs.promote.outputs.base }}
          CANDIDATE_COMMIT: ${{ needs.promote.outputs.candidate }}
          RELEASE_VERSION: ${{ needs.promote.outputs.version }}
          BUNDLE_PATH: ${{ runner.temp }}/release-artifact/release.bundle
          SUMMARY_PATH: ${{ runner.temp }}/release-artifact/release-summary.md
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/tooling/scripts/release.mjs" receive-promote

      - name: Determine publication permissions
        id: permissions
        shell: bash
        env:
          RELEASE_REPO: ${{ github.workspace }}/receiver
          BASE_COMMIT: ${{ needs.promote.outputs.base }}
          CANDIDATE_COMMIT: ${{ needs.promote.outputs.candidate }}
        run: |
          set -euo pipefail
          workflow_changes="$(git -C "$RELEASE_REPO" diff --name-only "$BASE_COMMIT" "$CANDIDATE_COMMIT" -- .github/workflows)"
          if [[ -n "$workflow_changes" ]]; then
            echo "workflows=write" >> "$GITHUB_OUTPUT"
          fi

      - name: Confirm main approval policy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! reviewers="$(gh api "repos/$REPOSITORY/environments/release-main" \
            --jq '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length > 0')"; then
            echo "::error::Cannot verify required approval for main publication."
            exit 1
          fi
          if [[ "$reviewers" != true ]]; then
            echo "::error::The release-main environment must require manual reviewer approval."
            exit 1
          fi

      - name: Confirm fast-forward baseline
        shell: bash
        env:
          RELEASE_REPO: ${{ github.workspace }}/receiver
          BASE_COMMIT: ${{ needs.promote.outputs.base }}
          CANDIDATE_COMMIT: ${{ needs.promote.outputs.candidate }}
        run: |
          set -euo pipefail
          if [[ ! "$BASE_COMMIT" =~ ^[0-9a-f]{40}$ || ! "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Publication requires full verified commit SHAs."
            exit 1
          fi
          candidate="$(git -C "$RELEASE_REPO" rev-parse --verify 'refs/heads/release/candidate^{commit}')"
          parents="$(git -C "$RELEASE_REPO" show -s --format=%P "$candidate")"
          read -r first second extra <<< "$parents"
          if [[ "$candidate" != "$CANDIDATE_COMMIT" || "$first" != "$BASE_COMMIT" || -z "$second" || -n "$extra" ]]; then
            echo "::error::The verified candidate must be a merge commit directly based on main."
            exit 1
          fi
          remote="$(git -C "$RELEASE_REPO" ls-remote --heads origin refs/heads/main)"
          if [[ "$remote" != "$BASE_COMMIT"$'\trefs/heads/main' ]]; then
            echo "::error::Main has advanced. Prepare a new release; main will not be overwritten."
            exit 1
          fi

      - name: Check GitHub App prerequisites
        shell: bash
        env:
          APP_ID: ${{ secrets.ASPIRE_BOT_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.ASPIRE_BOT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$APP_ID" || -z "$APP_PRIVATE_KEY" ]]; then
            echo "::error::Configure the ASPIRE_BOT_APP_ID and ASPIRE_BOT_PRIVATE_KEY secrets before publishing."
            exit 1
          fi

      - name: Create short-lived main publication token
        id: app-token
        # actions/create-github-app-token@v3.1.1
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3
        with:
          client-id: ${{ secrets.ASPIRE_BOT_APP_ID }}
          private-key: ${{ secrets.ASPIRE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: ${{ steps.permissions.outputs.workflows }}

      - name: Fast-forward main
        if: ${{ false }}
        id: push
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_REPO: ${{ github.workspace }}/receiver
          CANDIDATE_COMMIT: ${{ needs.promote.outputs.candidate }}
        run: |
          set -euo pipefail
          git -C "$RELEASE_REPO" \
            -c core.hooksPath=/dev/null \
            -c credential.helper= \
            -c 'credential.helper=!f() { if [ "$1" = get ]; then printf "%s\n" "username=x-access-token" "password=$GH_TOKEN"; fi; }; f' \
            push origin refs/heads/release/candidate:refs/heads/main
          remote="$(git -C "$RELEASE_REPO" ls-remote --heads origin refs/heads/main)"
          if [[ "$remote" != "$CANDIDATE_COMMIT"$'\trefs/heads/main' ]]; then
            echo "::error::Main does not match the approved release commit."
            exit 1
          fi
          echo "commit=$CANDIDATE_COMMIT" >> "$GITHUB_OUTPUT"
