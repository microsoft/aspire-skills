name: Skill Eval (nightly)

on:
  schedule:
    # Sunday 06:00 UTC — weekly comprehensive run.
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-eval-nightly
  cancel-in-progress: false

jobs:
  eval:
    name: Run nightly eval suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout@v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node
        # actions/setup-node@v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"

      - name: Install vally CLI
        run: npm install -g @microsoft/vally-cli

      - name: Run nightly evals
        # COPILOT_GITHUB_TOKEN is read by @github/copilot-sdk (the vally
        # `copilot-sdk` executor) to invoke Copilot models. It is scoped to
        # this step only so checkout / install / upload never see it.
        # The secret must be provisioned on the repo as `COPILOT_GITHUB_TOKEN`
        # — see evals/README.md → "CI authentication" for setup.
        #
        # If the secret is missing, soft-skip with a warning so the scheduled
        # nightly run doesn't spam maintainers with red runs until the secret
        # is provisioned. The summary explains how to enable the real gate.
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          if [ -z "${COPILOT_GITHUB_TOKEN:-}" ]; then
            echo "::warning title=Nightly eval skipped::COPILOT_GITHUB_TOKEN secret is not configured on this repo, so the nightly eval suite was skipped. A maintainer must add the secret (see evals/README.md → CI authentication) for the suite to run."
            {
              echo "### ⚠️ Nightly eval skipped"
              echo ""
              echo "The \`COPILOT_GITHUB_TOKEN\` repository secret is not configured, so"
              echo "the model-backed \`nightly\` eval suite did not run."
              echo ""
              echo "**To enable the suite**, a maintainer needs to add the secret once —"
              echo "see [\`evals/README.md\` → CI authentication](../blob/main/evals/README.md#ci-authentication)."
            } >> "$GITHUB_STEP_SUMMARY"
            mkdir -p ./results
            echo '{"skipped":"COPILOT_GITHUB_TOKEN not configured"}' > ./results/skipped.json
            exit 0
          fi
          vally eval \
            --suite nightly \
            --context-dir evals \
            --output-dir ./results

      - name: Upload trajectories
        if: always()
        # actions/upload-artifact@v4 (resolved 2026-06-02)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eval-results-nightly
          path: ./results/
          if-no-files-found: warn
