name: Skill Eval (nightly)

on:
  schedule:
    # Sunday 06:00 UTC — weekly comprehensive run.
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-eval-nightly
  cancel-in-progress: false

jobs:
  eval:
    name: Run nightly eval suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Install vally and Copilot runtime
        # Keep Vally and its native runtime under one node_modules ancestor so
        # @github/copilot-sdk can resolve the matching platform package.
        run: |
          tools_dir="$RUNNER_TEMP/aspire-eval-tools"
          npm install --ignore-scripts --prefix "$tools_dir" @microsoft/vally-cli@0.16.0 @github/copilot-linux-x64@1.0.80
          "$tools_dir/node_modules/.bin/vally" --version
          cli_path="$tools_dir/node_modules/@github/copilot-linux-x64/index.js"
          test -f "$cli_path"
          node "$cli_path" --version
          echo "$tools_dir/node_modules/.bin" >> "$GITHUB_PATH"
          echo "COPILOT_CLI_PATH=$cli_path" >> "$GITHUB_ENV"

      - name: Run nightly evals
        id: evals
        # Runtime env auth avoids Vally's explicit SDK user-token override.
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          unset GITHUB_TOKEN GH_TOKEN GITHUB_COPILOT_API_TOKEN
          vally eval \
            --require-pass \
            --suite nightly \
            --output-dir ./results

      - name: Check evaluation infrastructure
        if: ${{ !cancelled() && (steps.evals.outcome == 'success' || steps.evals.outcome == 'failure') }}
        run: |
          node scripts/check-eval-results.mjs ./results .

      - name: Redact evaluation artifacts
        id: redact
        if: ${{ !cancelled() && (steps.evals.outcome == 'success' || steps.evals.outcome == 'failure') }}
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/redact-eval-artifacts.mjs ./results

      - name: Upload trajectories
        if: ${{ !cancelled() && steps.redact.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eval-results-nightly
          path: ./results/
          if-no-files-found: warn
