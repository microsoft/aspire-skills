name: Update Aspire telemetry

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Merged PR to synchronize from current main, or unmerged PR to preview with dry_run
        required: true
        type: string
      dry_run:
        description: Preview the generated catalog without publishing a PR
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

jobs:
  sync:
    if: >-
      (github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch')
      && github.repository == 'microsoft/aspire-skills'
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.id == github.repository_id)
      && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    # Job-level so skipped events and previews cannot replace a pending publication run.
    concurrency:
      group: ${{ inputs.dry_run && format('aspire-skills-to-aspire-preview-{0}', github.run_id) || 'aspire-skills-to-aspire' }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Resolve immutable source
        id: source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const { resolveTelemetrySource } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/update-aspire-telemetry.mjs`);
            const source = await resolveTelemetrySource({ github, context });
            core.setOutput("commit", source.commit);
            core.setOutput("dry-run", String(source.dryRun));
            core.setOutput("source", JSON.stringify(source));

      - name: Checkout source inventory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.source.outputs.commit }}
          path: _source
          persist-credentials: false

      - name: Generate Aspire publication token
        id: token
        if: steps.source.outputs.dry-run != 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ secrets.ASPIRE_BOT_APP_ID }}
          private-key: ${{ secrets.ASPIRE_BOT_PRIVATE_KEY }}
          owner: microsoft
          repositories: aspire
          permission-contents: write
          permission-pull-requests: write

      - name: Synchronize telemetry catalog
        id: sync
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          TELEMETRY_SOURCE: ${{ steps.source.outputs.source }}
          SOURCE_TOKEN: ${{ github.token }}
        with:
          github-token: ${{ steps.token.outputs.token || github.token }}
          script: |
            const { runTelemetrySync } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/update-aspire-telemetry.mjs`);
            await runTelemetrySync({
              github, core,
              sourceGithub: getOctokit(process.env.SOURCE_TOKEN),
              directory: `${process.env.GITHUB_WORKSPACE}/_source`,
              source: JSON.parse(process.env.TELEMETRY_SOURCE),
              final: false
            });

      # Main moved after resolution, possibly through a fork merge or direct push that starts no run.
      # Re-run the same guarded resolution, checkout, and publication once against newer main.
      - name: Resolve newer main source
        id: retry-source
        if: steps.sync.outputs.status == 'superseded'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const { resolveTelemetrySource } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/update-aspire-telemetry.mjs`);
            const source = await resolveTelemetrySource({ github, context });
            core.setOutput("commit", source.commit);
            core.setOutput("source", JSON.stringify(source));

      - name: Checkout newer source inventory
        if: steps.sync.outputs.status == 'superseded'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.retry-source.outputs.commit }}
          path: _source-retry
          persist-credentials: false

      - name: Synchronize telemetry catalog from newer main
        if: steps.sync.outputs.status == 'superseded'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          TELEMETRY_SOURCE: ${{ steps.retry-source.outputs.source }}
          SOURCE_TOKEN: ${{ github.token }}
        with:
          github-token: ${{ steps.token.outputs.token || github.token }}
          script: |
            const { runTelemetrySync } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/update-aspire-telemetry.mjs`);
            await runTelemetrySync({
              github, core,
              sourceGithub: getOctokit(process.env.SOURCE_TOKEN),
              directory: `${process.env.GITHUB_WORKSPACE}/_source-retry`,
              source: JSON.parse(process.env.TELEMETRY_SOURCE),
              final: true
            });
