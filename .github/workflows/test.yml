name: Tests

on:
  pull_request:
    branches:
      - main
      - dev
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  token-permissions-probe:
    name: Actions token permission probe
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 69 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ellahathaway-release-workflow-bootstrap'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Probe comments and draft PR creation, then clean up
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const branch = `actions-token-probe/${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}`;
            const results = [];
            let comment;
            let branchCreated = false;
            let pull;
            let unexpectedError;
            try {
              try {
                comment = (await github.rest.issues.createComment({
                  owner, repo, issue_number,
                  body: 'Checking Actions token comment and PR-creation permissions. Any diagnostic draft PR will be closed and its temporary branch deleted.'
                })).data;
                results.push('PR comments: **allowed** (created with `github.token`).');
              } catch (error) {
                if (error.status !== 403) throw error;
                results.push(`PR comments: **denied** (HTTP 403: ${error.message}).`);
                core.warning(results.at(-1));
              }
              await github.rest.git.createRef({
                owner, repo, ref: `refs/heads/${branch}`,
                sha: context.payload.pull_request.head.sha
              });
              branchCreated = true;
              try {
                pull = (await github.rest.pulls.create({
                  owner, repo, head: branch,
                  base: context.payload.pull_request.base.ref,
                  draft: true,
                  title: 'Actions token permission probe - do not merge',
                  body: 'Temporary diagnostic for #69. Created using the Actions GITHUB_TOKEN solely to verify PR-creation permissions; the same job closes this draft and deletes its branch. No merge, tag, or release is authorized.'
                })).data;
                results.push(`PR creation: **allowed** (diagnostic draft #${pull.number}).`);
              } catch (error) {
                if (error.status !== 403) throw error;
                results.push(`PR creation: **denied** (HTTP 403: ${error.message}).`);
                core.warning(results.at(-1));
              }
            } catch (error) {
              unexpectedError = error;
              results.push(`Probe incomplete: ${error.message}`);
            } finally {
              if (pull) {
                try {
                  await github.rest.pulls.update({ owner, repo, pull_number: pull.number, state: 'closed' });
                  results.push(`Diagnostic draft #${pull.number}: closed.`);
                } catch (error) {
                  core.setFailed(`Cannot close diagnostic draft #${pull.number}: ${error.message}`);
                }
              }
              if (branchCreated) {
                try {
                  await github.rest.git.deleteRef({ owner, repo, ref: `heads/${branch}` });
                  results.push('Temporary diagnostic branch: deleted.');
                } catch (error) {
                  core.setFailed(`Cannot delete diagnostic branch ${branch}: ${error.message}`);
                }
              }
              const body = `### Actions token permission results\n\nSource: \`${context.payload.pull_request.head.sha}\`\n\n${results.join('\n\n')}\n\n[Actions run](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId})`;
              await core.summary.addRaw(body).write();
              if (comment) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: comment.id, body });
              }
            }
            if (unexpectedError) throw unexpectedError;

  dev-source-check:
    name: Dev source-only check
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'dev') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact dev change
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Reject release-only files on dev
        run: node scripts/check-dev-tree.mjs

  test:
    name: Test and build
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"

      - name: Install test dependencies
        run: npm ci --ignore-scripts

      - name: Test
        run: npm test

  branch-check:
    name: Branch check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate branch combination
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [[ -z "${HEAD_BRANCH:-}" || "${HEAD_BRANCH:-}" == *[[:space:]]* ]]; then
            echo "::error::A nonempty, valid PR head branch is required."
            exit 1
          fi
          case "${TARGET_BRANCH:-}" in
            main)
              if [[ "$HEAD_BRANCH" != release/?* &&
                    "$HEAD_BRANCH" != ellahathaway-release-workflow-bootstrap &&
                    ! "$HEAD_BRANCH" =~ ^backport/pr-[1-9][0-9]*-to-main$ ]]; then
                echo "::error::PRs to main must come from maintainer-created release/* or backport/pr-<number>-to-main branches."
                exit 1
              fi
              ;;
            dev)
              case "$HEAD_BRANCH" in
                main|dev|release/*)
                  echo "::error::PRs to dev must not come directly from main, dev, or release/*."
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "::error::PRs must target main or dev."
              exit 1
              ;;
          esac

  release-validation:
    name: Release validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout trusted main tooling
        # PR workflows themselves still require branch protection and trusted review.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          path: tooling
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact head, not the synthetic merge
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: checked
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"

      - name: Install trusted release dependencies
        working-directory: tooling
        run: npm ci --ignore-scripts

      - name: Fetch release branches
        shell: bash
        env:
          RELEASE_REPO: ${{ github.workspace }}/checked
        run: |
          set -euo pipefail
          if ! git -C "$RELEASE_REPO" fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/dev:refs/remotes/origin/dev; then
            echo "::error::Cannot fetch origin/main and origin/dev; both branches must exist."
            exit 1
          fi

      - name: Check branch release invariants
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.workspace }}/checked
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref || '' }}
          HEAD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_COMMIT: ${{ github.event.pull_request.base.sha || '' }}
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          tooling="$GITHUB_WORKSPACE/tooling/.github/skills/release/scripts/release.mjs"
          if [[ ! -f "$tooling" ]]; then
            if [[ "$TARGET_BRANCH" == main &&
                  "$HEAD_BRANCH" == ellahathaway-release-workflow-bootstrap &&
                  "$SAME_REPOSITORY" == true ]]; then
              node --input-type=module -e '
                import { readFileSync } from "node:fs";
                const pkg = JSON.parse(readFileSync(process.env.GITHUB_WORKSPACE + "/tooling/package.json"));
                if (pkg.version !== "0.0.4") throw new Error("Publish the legacy 0.0.4 release before landing the bootstrap.");
              '
              git -C "$GITHUB_WORKSPACE/tooling" fetch --no-tags origin \
                refs/tags/v0.0.4:refs/tags/v0.0.4
              git -C "$GITHUB_WORKSPACE/tooling" merge-base --is-ancestor \
                'v0.0.4^{commit}' HEAD
              if [[ "$(gh release view v0.0.4 --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" != false ]]; then
                echo "::error::The legacy 0.0.4 release must be published, not draft."
                exit 1
              fi
              echo "One-time infrastructure bootstrap; normal tests and maintainer approval remain required."
              exit 0
            fi
            echo "::error::Trusted main release tooling is missing outside the approved bootstrap."
            exit 1
          fi
          node "$tooling" check
