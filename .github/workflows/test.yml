name: Tests

on:
  pull_request:
    branches:
      - main
      - dev
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  copilot-model-catalog:
    name: One-time Actions Copilot model catalogue
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 69 &&
      github.event.pull_request.head.ref == 'ellahathaway-release-workflow-bootstrap' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'ellahathaway' &&
      github.actor == 'ellahathaway'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"

      - name: Install the eval runtime without running evals
        run: |
          tools_dir="$RUNNER_TEMP/aspire-eval-tools"
          npm install --ignore-scripts --prefix "$tools_dir" @microsoft/vally-cli@0.16.0 @github/copilot-linux-x64@1.0.80
          npm ls --prefix "$tools_dir" @microsoft/vally @github/copilot-sdk @github/copilot-linux-x64
          cli_path="$tools_dir/node_modules/@github/copilot-linux-x64/index.js"
          test -f "$cli_path"
          node "$cli_path" --version
          echo "COPILOT_CLI_PATH=$cli_path" >> "$GITHUB_ENV"
          echo "EVAL_TOOLS_DIR=$tools_dir" >> "$GITHUB_ENV"

      - name: List models using only the Actions runtime token
        timeout-minutes: 2
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          unset GITHUB_TOKEN GH_TOKEN GITHUB_COPILOT_API_TOKEN COPILOT_API_URL
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { appendFileSync } from "node:fs";
          import { createRequire } from "node:module";
          import { pathToFileURL } from "node:url";
          const require = createRequire(`${process.env.EVAL_TOOLS_DIR}/node_modules/@microsoft/vally/package.json`);
          const { CopilotClient } = await import(pathToFileURL(require.resolve("@github/copilot-sdk")).href);
          const client = new CopilotClient({ cliPath: process.env.COPILOT_CLI_PATH });
          const timer = setTimeout(() => {
            console.error("Actions model catalogue request exceeded 60 seconds.");
            process.exit(1);
          }, 60_000);
          try {
            await client.start();
            const models = await client.listModels();
            assert.ok(Array.isArray(models) && models.length > 0, "The runtime returned no model catalogue.");
            for (const model of models) assert.ok(typeof model.id === "string" && model.id.length > 0);
            const catalogue = {
              runId: process.env.GITHUB_RUN_ID,
              repository: process.env.GITHUB_REPOSITORY,
              authentication: "COPILOT_GITHUB_TOKEN from github.token; no SDK githubToken override",
              operation: "models.list only; no sessions or inference",
              models: models.toSorted((a, b) => a.id.localeCompare(b.id)),
            };
            const json = JSON.stringify(catalogue, null, 2);
            console.log(json);
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Actions Copilot model catalogue\n\n\`\`\`json\n${json}\n\`\`\`\n`);
          } finally {
            await client.stop();
            clearTimeout(timer);
          }
          NODE

  dev-source-check:
    name: Dev source-only check
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'dev') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact dev change
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Reject release-only files on dev
        run: node scripts/check-dev-tree.mjs

  test:
    name: Test and build
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"

      - name: Install test dependencies
        run: npm ci --ignore-scripts

      - name: Test
        run: npm test

  branch-check:
    name: Branch check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate branch combination
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [[ -z "${HEAD_BRANCH:-}" || "${HEAD_BRANCH:-}" == *[[:space:]]* ]]; then
            echo "::error::A nonempty, valid PR head branch is required."
            exit 1
          fi
          case "${TARGET_BRANCH:-}" in
            main)
              if [[ "$HEAD_BRANCH" != release/?* &&
                    "$HEAD_BRANCH" != ellahathaway-release-workflow-bootstrap &&
                    ! "$HEAD_BRANCH" =~ ^backport/pr-[1-9][0-9]*-to-main$ ]]; then
                echo "::error::PRs to main must come from maintainer-created release/* or backport/pr-<number>-to-main branches."
                exit 1
              fi
              ;;
            dev)
              case "$HEAD_BRANCH" in
                main|dev|release/*)
                  echo "::error::PRs to dev must not come directly from main, dev, or release/*."
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "::error::PRs must target main or dev."
              exit 1
              ;;
          esac

  release-validation:
    name: Release validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout trusted main tooling
        # PR workflows themselves still require branch protection and trusted review.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          path: tooling
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact head, not the synthetic merge
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: checked
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"

      - name: Install trusted release dependencies
        working-directory: tooling
        run: npm ci --ignore-scripts

      - name: Fetch release branches
        shell: bash
        env:
          RELEASE_REPO: ${{ github.workspace }}/checked
        run: |
          set -euo pipefail
          if ! git -C "$RELEASE_REPO" fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/dev:refs/remotes/origin/dev; then
            echo "::error::Cannot fetch origin/main and origin/dev; both branches must exist."
            exit 1
          fi

      - name: Check branch release invariants
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.workspace }}/checked
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref || '' }}
          HEAD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_COMMIT: ${{ github.event.pull_request.base.sha || '' }}
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          tooling="$GITHUB_WORKSPACE/tooling/.github/skills/release/scripts/release.mjs"
          if [[ ! -f "$tooling" ]]; then
            if [[ "$TARGET_BRANCH" == main &&
                  "$HEAD_BRANCH" == ellahathaway-release-workflow-bootstrap &&
                  "$SAME_REPOSITORY" == true ]]; then
              node --input-type=module -e '
                import { readFileSync } from "node:fs";
                const pkg = JSON.parse(readFileSync(process.env.GITHUB_WORKSPACE + "/tooling/package.json"));
                if (pkg.version !== "0.0.4") throw new Error("Publish the legacy 0.0.4 release before landing the bootstrap.");
              '
              git -C "$GITHUB_WORKSPACE/tooling" fetch --no-tags origin \
                refs/tags/v0.0.4:refs/tags/v0.0.4
              git -C "$GITHUB_WORKSPACE/tooling" merge-base --is-ancestor \
                'v0.0.4^{commit}' HEAD
              if [[ "$(gh release view v0.0.4 --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" != false ]]; then
                echo "::error::The legacy 0.0.4 release must be published, not draft."
                exit 1
              fi
              echo "One-time infrastructure bootstrap; normal tests and maintainer approval remain required."
              exit 0
            fi
            echo "::error::Trusted main release tooling is missing outside the approved bootstrap."
            exit 1
          fi
          node "$tooling" check
