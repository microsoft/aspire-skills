name: Tests

on:
  pull_request:
    branches: [main, dev, release/**]
  push:
    branches: [main, dev]
  merge_group:

permissions:
  contents: read

jobs:
  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Enable Git symlinks on Windows
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"

      - name: Install test dependencies
        run: npm ci --ignore-scripts

      - name: Setup Bash on macOS
        if: runner.os == 'macOS'
        run: |
          brew install bash
          echo "$(brew --prefix bash)/bin" >> "$GITHUB_PATH"

      - name: Setup pinned workflow compiler
        if: runner.os == 'Linux'
        uses: github/gh-aw-actions/setup-cli@866158eb5c6cbfd3c614104e3d3d6634e246d220
        with:
          version: v0.91.8

      - name: Compile agentic workflows
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh aw compile --purge --validate
          --action-mode action --action-tag 866158eb5c6cbfd3c614104e3d3d6634e246d220
          --no-check-update --schedule-seed microsoft/aspire-skills

      - name: Reject generated workflow drift
        if: runner.os == 'Linux'
        shell: bash
        run: |
          changes=$(git status --porcelain --untracked-files=all -- \
            '.github/aw/actions-lock.json' \
            '.github/dependabot.yml' \
            '.github/workflows/*.lock.yml' \
            '.github/workflows/agentics-maintenance*.yml')
          if [[ -n "$changes" ]]; then
            echo "Generated agentic workflow files are not up to date:"
            printf '%s\n' "$changes"
            exit 1
          fi

      - name: Test
        env:
          CHROME_BIN: ${{ runner.os == 'Linux' && '/usr/bin/google-chrome' || '' }}
        run: npm test

      - name: Test Windows Git placeholder checkout
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $checkout = Join-Path $env:RUNNER_TEMP "canvas-placeholder-checkout"
          git -c core.symlinks=false worktree add --detach $checkout HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          try {
            node --test (Join-Path $checkout "tests\canvas-ui.test.mjs")
            $testExitCode = $LASTEXITCODE
            if ($testExitCode -eq 0) {
              node --experimental-vm-modules --test --test-name-pattern="shared canvas assets are served locally" (Join-Path $checkout "tests\fixtures\aspire-apphosts-provider-boundary.mjs")
              $testExitCode = $LASTEXITCODE
            }
          } finally {
            git -c core.symlinks=false worktree remove $checkout
            if ($LASTEXITCODE -ne 0) { throw "Could not remove the placeholder test worktree." }
          }
          exit $testExitCode

      - name: Setup pinned telemetry publisher runtime
        if: runner.os == 'Linux'
        uses: github/gh-aw-actions/setup@866158eb5c6cbfd3c614104e3d3d6634e246d220

      - name: Test telemetry publication boundary
        if: runner.os == 'Linux'
        env:
          GH_AW_ACTIONS_DIR: ${{ runner.temp }}/gh-aw/actions
        run: node --test tests/telemetry-publication/*.test.mjs

      - name: Exercise telemetry container isolation
        id: telemetry-isolation
        if: runner.os == 'Linux'
        run: node tests/telemetry-publication/isolation-canary.mjs

      - name: Reject interpreted container commands
        if: runner.os == 'Linux'
        env:
          FORGED_CONTAINER_OUTPUT: ${{ steps.telemetry-isolation.outputs.forged }}
        run: test -z "$FORGED_CONTAINER_OUTPUT"
