name: Tests

on:
  pull_request:
    branches: [main, dev, release/**]
  push:
    branches: [main, dev, release/**]

permissions:
  contents: read

jobs:
  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"

      - name: Install test dependencies
        run: npm ci --ignore-scripts

      - name: Test
        run: npm test

      - name: Setup pinned telemetry publisher runtime
        if: runner.os == 'Linux'
        uses: github/gh-aw-actions/setup@2fbab69bfca02bebd76cd0fc43f2d12acfed994f

      - name: Test telemetry publication boundary
        if: runner.os == 'Linux'
        env:
          GH_AW_ACTIONS_DIR: ${{ runner.temp }}/gh-aw/actions
        run: node --test tests/telemetry-publication/*.test.mjs
