name: Publish Aspire bundles

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    name: Publish bundles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Read version from tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "This workflow must run from a version tag such as v0.0.1." >&2
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '${GITHUB_REF_NAME}' is not a supported semantic version tag." >&2
            exit 1
          fi

          source_commit="$(git rev-parse 'HEAD^{commit}')"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "skills_asset=dist/aspire-skills-v$version.tgz" >> "$GITHUB_OUTPUT"
          echo "extensions_asset=dist/aspire-extensions-v$version.tgz" >> "$GITHUB_OUTPUT"

      - name: Test bundles
        run: npm test

      - name: Build bundles
        run: >-
          npm run bundle --
          --version "${{ steps.version.outputs.version }}"
          --out dist
          --source-commit "${{ steps.version.outputs.source_commit }}"

      - name: Attest bundles
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ steps.version.outputs.skills_asset }}
            ${{ steps.version.outputs.extensions_asset }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          SKILLS_ASSET: ${{ steps.version.outputs.skills_asset }}
          EXTENSIONS_ASSET: ${{ steps.version.outputs.extensions_asset }}
        shell: bash
        run: |
          set -euo pipefail
          assets=("$SKILLS_ASSET" "$EXTENSIONS_ASSET")
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${assets[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${assets[@]}" \
              --verify-tag \
              --title "$TAG_NAME" \
              --notes "Aspire bundles $VERSION"
          fi
