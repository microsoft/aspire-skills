name: Publish release artifacts

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

concurrency:
  group: aspire-skills-release-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  release:
    name: Tag and publish release bundles
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_REPO: ${{ github.workspace }}
      RELEASE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
      RELEASE_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout the exact reviewed main squash
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"

      - name: Install release dependencies
        run: npm ci --ignore-scripts

      - name: Validate the reviewed release
        id: validate
        run: node .github/skills/release/scripts/release.mjs validate-release

      - name: Build bundles
        env:
          RELEASE_VERSION: ${{ steps.validate.outputs.version }}
        run: >-
          npm run bundle --
          --version "$RELEASE_VERSION"
          --out dist
          --source-commit "$RELEASE_COMMIT"

      - name: Attest bundles
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: |
            dist/aspire-skills-v${{ steps.validate.outputs.version }}.tgz
            dist/aspire-extensions-v${{ steps.validate.outputs.version }}.tgz

      - name: Publish the immutable tag and GitHub release
        id: publish
        run: node .github/skills/release/scripts/release.mjs publish-release

      - name: Upload skills bundle
        env:
          RELEASE_TAG: ${{ steps.publish.outputs.tag }}
          RELEASE_VERSION: ${{ steps.validate.outputs.version }}
        run: >-
          gh release upload "$RELEASE_TAG"
          "dist/aspire-skills-v$RELEASE_VERSION.tgz"
          --repo "$GITHUB_REPOSITORY" --clobber
