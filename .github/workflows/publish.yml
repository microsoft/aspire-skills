name: Publish Aspire bundles

on:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "[0-9]*"
    paths:
      - ".github/workflows/publish.yml"
      - ".plugin/plugin.json"
      - ".claude-plugin/plugin.json"
      - ".claude-plugin/marketplace.json"
      - ".cursor-plugin/marketplace.json"
      - "gemini-extension.json"
      - "package.json"
      - "scripts/resolve-release.mjs"
  workflow_dispatch:

concurrency:
  group: publish-aspire-bundles
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    name: Publish bundles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Resolve release
        id: release
        env:
          BEFORE_SHA: ${{ github.event.before }}
          REPOSITORY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/resolve-release.mjs

      - name: Check release status
        id: status
        env:
          AUTO_TAG: ${{ steps.release.outputs.auto_tag }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ steps.release.outputs.source_commit }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          VERSION_CHANGED: ${{ steps.release.outputs.version_changed }}
        shell: bash
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --refs --tags origin "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$TAG_NAME:refs/tags/$TAG_NAME"
            tag_commit="$(git rev-list -n 1 "$TAG_NAME")"
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
            if [[ "$AUTO_TAG" == "true" ]] && gh release view "$TAG_NAME" >/dev/null 2>&1; then
              if [[ "$VERSION_CHANGED" == "true" && "$tag_commit" != "$SOURCE_COMMIT" ]]; then
                echo "Version $TAG_NAME already belongs to $tag_commit, not $SOURCE_COMMIT." >&2
                exit 1
              fi

              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "::notice title=Release already published::$TAG_NAME already exists."
            else
              if [[ "$tag_commit" != "$SOURCE_COMMIT" ]]; then
                echo "Tag '$TAG_NAME' points to $tag_commit instead of $SOURCE_COMMIT." >&2
                exit 1
              fi

              echo "publish=true" >> "$GITHUB_OUTPUT"
            fi
          else
            if [[ "$AUTO_TAG" != "true" ]]; then
              echo "Tag '$TAG_NAME' does not exist on origin." >&2
              exit 1
            fi

            echo "create_tag=true" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test bundles
        if: steps.status.outputs.publish == 'true'
        run: npm test

      - name: Build bundles
        if: steps.status.outputs.publish == 'true'
        run: >-
          npm run bundle --
          --version "${{ steps.release.outputs.version }}"
          --out dist
          --source-commit "${{ steps.release.outputs.source_commit }}"

      - name: Attest bundles
        if: steps.status.outputs.publish == 'true'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            ${{ steps.release.outputs.skills_asset }}
            ${{ steps.release.outputs.extensions_asset }}

      - name: Create release tag
        if: steps.status.outputs.create_tag == 'true'
        env:
          SOURCE_COMMIT: ${{ steps.release.outputs.source_commit }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          git tag "$TAG_NAME" "$SOURCE_COMMIT"
          git push origin "refs/tags/$TAG_NAME"

      - name: Publish GitHub release
        if: steps.status.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          VERSION: ${{ steps.release.outputs.version }}
          SKILLS_ASSET: ${{ steps.release.outputs.skills_asset }}
          EXTENSIONS_ASSET: ${{ steps.release.outputs.extensions_asset }}
        shell: bash
        run: |
          set -euo pipefail
          assets=("$SKILLS_ASSET" "$EXTENSIONS_ASSET")
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${assets[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${assets[@]}" \
              --verify-tag \
              --title "$TAG_NAME" \
              --notes "Aspire bundles $VERSION"
          fi
