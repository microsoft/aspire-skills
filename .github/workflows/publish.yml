name: Publish release

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

concurrency:
  group: aspire-skills-release-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish reviewed release
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
      RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Checkout the exact merged main commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"

      - name: Install release dependencies
        run: npm ci --ignore-scripts

      - name: Check release contents
        id: release
        run: |
          npm test
          npm run catalog:check
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync, writeFileSync } from "node:fs";
          import { parseVersion } from "./scripts/release-versions.mjs";
          const { version } = JSON.parse(readFileSync("package.json", "utf8"));
          parseVersion(version);
          if (process.env.RELEASE_BRANCH !== `release/${version}`) throw new Error("Release branch and version disagree.");
          const changelog = readFileSync("CHANGELOG.md", "utf8").replaceAll("\r\n", "\n");
          const entry = changelog.split(/^## /m)[1];
          const heading = `[${version}](https://github.com/${process.env.GITHUB_REPOSITORY}/releases/tag/v${version})`;
          if (!entry?.startsWith(`${heading}\n`)) throw new Error("The newest changelog heading must match the release.");
          const notes = entry.slice(heading.length).trim();
          if (!notes) throw new Error("Finalize the release notes before publishing.");
          writeFileSync(`${process.env.RUNNER_TEMP}/release-notes.md`, `${notes}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\ntag=v${version}\n`);
          NODE

      - name: Build bundles
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: >-
          npm run bundle --
          --version "$RELEASE_VERSION"
          --out dist
          --source-commit "$RELEASE_COMMIT"

      - name: Attest bundles
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: |
            dist/aspire-skills-v${{ steps.release.outputs.version }}.tgz
            dist/aspire-extensions-v${{ steps.release.outputs.version }}.tgz

      - name: Publish tag and release
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse 'HEAD^{commit}')" == "$RELEASE_COMMIT" ]]
          ref="refs/tags/$RELEASE_TAG"
          if git show-ref --verify --quiet "$ref"; then
            if [[ "$(git rev-parse "$ref^{commit}")" != "$RELEASE_COMMIT" ]]; then
              echo "::error::$RELEASE_TAG points to a different commit; tags must not move." >&2
              exit 1
            fi
            if [[ "$(git for-each-ref --format='%(objecttype)' "$ref")" != tag ||
              "$(git for-each-ref --format='%(contents)' "$ref")" != "$(cat "$RUNNER_TEMP/release-notes.md")" ]]; then
              echo "::error::$RELEASE_TAG must be an annotated tag with the approved release notes." >&2
              exit 1
            fi
          else
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              tag --annotate --no-sign --cleanup=verbatim --file "$RUNNER_TEMP/release-notes.md" "$RELEASE_TAG" "$RELEASE_COMMIT"
          fi
          gh auth setup-git --hostname github.com
          git -c push.followTags=false push origin "$ref"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body,isDraft \
            --jq 'if .isDraft then error("The existing release is a draft.") else .body end' \
            > "$RUNNER_TEMP/published-notes.md" 2> "$RUNNER_TEMP/release-error.txt"; then
            if [[ "$(cat "$RUNNER_TEMP/published-notes.md")" != "$(cat "$RUNNER_TEMP/release-notes.md")" ]]; then
              echo "::error::The existing release notes differ from the approved changelog." >&2
              exit 1
            fi
          elif [[ "$(cat "$RUNNER_TEMP/release-error.txt")" == "release not found" ]]; then
            options=()
            if [[ "${RELEASE_VERSION%%+*}" == *-* ]]; then options+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --target "$RELEASE_COMMIT" --title "$RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md" "${options[@]}"
          else
            cat "$RUNNER_TEMP/release-error.txt" >&2
            exit 1
          fi

      - name: Upload skills bundle
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: >-
          gh release upload "$RELEASE_TAG" "dist/aspire-skills-v$RELEASE_VERSION.tgz"
          --repo "$GITHUB_REPOSITORY" --clobber
