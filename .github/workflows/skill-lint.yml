name: Skill Lint

on:
  pull_request:
    paths:
      - "**/SKILL.md"
      - "**/*.yaml"
      - ".vally.yaml"
      - ".github/workflows/skill-lint.yml"

permissions:
  contents: read

jobs:
  lint:
    name: Lint skills and eval specs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Install vally CLI
        run: |
          npm install -g @microsoft/vally-cli@0.16.0
          vally --version

      - name: Lint skills
        # `vally lint skills` matches the plugin's own `./skills/` glob.
        # Internal author skills under `.github/skills/` (e.g. pr-review) are
        # intentionally out of plugin scope and out of lint scope.
        run: vally lint skills

      - name: Validate eval specs
        # Each skills/*/evals/eval.yaml uses the canonical vally schema.
        # `vally lint --eval-spec` checks shape, stimulus structure, grader
        # config, and resolves environment.files against the working dir.
        # Schema errors fail the check; existing warnings remain visible.
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          specs=(skills/*/evals/eval.yaml)
          if [[ ${#specs[@]} -eq 0 ]]; then
            echo "::error::No eval specs found under skills/*/evals/eval.yaml" >&2
            exit 1
          fi
          status=0
          for spec in "${specs[@]}"; do
            echo "::group::Validating $spec"
            if ! vally lint --eval-spec "$spec"; then
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"
