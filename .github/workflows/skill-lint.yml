name: Skill Lint

on:
  pull_request:
    paths:
      - "**/SKILL.md"
      - "**/*.yaml"
      - ".vally.yaml"
      - ".github/workflows/skill-lint.yml"

permissions:
  contents: read

jobs:
  lint:
    name: Lint skills and eval specs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install vally CLI
        run: npm install -g @microsoft/vally-cli

      - name: Lint skills
        # `vally lint skills` matches the plugin's own `./skills/` glob.
        # Internal author skills under `.github/skills/` (e.g. pr-review) are
        # intentionally out of plugin scope and out of lint scope.
        run: vally lint skills

      - name: Validate eval specs
        # Each skills/*/evals/eval.yaml is in the canonical vally schema.
        # `vally lint --eval-spec` checks shape, stimulus structure, grader
        # config, and resolves environment.files against the working dir.
        # No --strict; the validator is strict by default.
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          specs=(skills/*/evals/eval.yaml)
          if [[ ${#specs[@]} -eq 0 ]]; then
            echo "::error::No eval specs found under skills/*/evals/eval.yaml" >&2
            exit 1
          fi
          for spec in "${specs[@]}"; do
            echo "::group::Validating $spec"
            vally lint --eval-spec "$spec"
            echo "::endgroup::"
          done
