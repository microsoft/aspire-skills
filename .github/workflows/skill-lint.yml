name: Skill Lint

on:
  pull_request:
    paths:
      - "**/SKILL.md"
      - "**/*.yaml"
      - ".vally.yaml"
      - ".github/workflows/skill-lint.yml"

permissions:
  contents: read

jobs:
  lint:
    name: Lint skills and eval specs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout@v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node
        # actions/setup-node@v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"

      - name: Install vally CLI
        run: npm install -g @microsoft/vally-cli

      - name: Lint skills
        run: vally lint .

      - name: Validate eval specs
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          specs=(skills/*/evals/eval.yaml)
          if [[ ${#specs[@]} -eq 0 ]]; then
            echo "No eval specs found under skills/*/evals/eval.yaml" >&2
            exit 1
          fi
          for spec in "${specs[@]}"; do
            echo "::group::Validating $spec"
            vally lint --eval-spec "$spec" --strict
            echo "::endgroup::"
          done
