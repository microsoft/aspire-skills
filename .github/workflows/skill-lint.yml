name: Skill Lint

on:
  pull_request:
    paths:
      - "**/SKILL.md"
      - "**/*.yaml"
      - ".vally.yaml"
      - ".github/workflows/skill-lint.yml"

permissions:
  contents: read

jobs:
  lint:
    name: Lint skills and eval specs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout@v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node
        # actions/setup-node@v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"

      - name: Install vally CLI
        run: npm install -g @microsoft/vally-cli

      - name: Lint skills
        # `vally lint skills` matches the plugin's own `./skills/` glob.
        # Internal author skills under `.github/skills/` (e.g. pr-review) are
        # intentionally out of plugin scope and out of lint scope.
        run: vally lint skills

      - name: Validate eval specs
        # NOTE: the per-skill eval.yaml files are still in waza format
        # (tasks/* glob + metrics/expected/inputs.prompt schema). Vally's eval
        # schema is incompatible (stimuli inline, scoring weights/threshold,
        # prompt/environment/graders restructure) — see
        # evals/README.md → "Pending eval-content migration".
        # Until that migration lands, run vally's strict validator in
        # report-only mode so the diagnostics are visible in the PR without
        # blocking merges.
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          shopt -s nullglob
          specs=(skills/*/evals/eval.yaml)
          if [[ ${#specs[@]} -eq 0 ]]; then
            echo "::error::No eval specs found under skills/*/evals/eval.yaml" >&2
            exit 1
          fi
          fail=0
          for spec in "${specs[@]}"; do
            echo "::group::Validating $spec"
            if ! vally lint --eval-spec "$spec" --strict; then
              echo "::warning file=$spec::vally rejected this spec — see 'Pending eval-content migration' in evals/README.md"
              fail=1
            fi
            echo "::endgroup::"
          done
          if [[ $fail -ne 0 ]]; then
            {
              echo "### ⚠️ Eval spec validation reported issues"
              echo ""
              echo "The per-skill \`eval.yaml\` files are still in the legacy waza"
              echo "schema. Vally's stricter validator rejects them, but this step is"
              echo "set to \`continue-on-error: true\` so the PR can still merge."
              echo ""
              echo "**Next step**: migrate eval content to vally's schema — see"
              echo "[\`evals/README.md\` → Pending eval-content migration](../blob/main/evals/README.md#pending-eval-content-migration)."
            } >> "$GITHUB_STEP_SUMMARY"
            # Soft-fail the step so the annotation shows up but the workflow stays green.
            exit 0
          fi
