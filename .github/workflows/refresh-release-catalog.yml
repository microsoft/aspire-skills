name: Refresh release catalogs

on:
  push:
    branches: [release/**]
  workflow_dispatch:
    inputs:
      branch:
        description: Release branch to refresh
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-catalog-${{ github.event_name == 'push' && github.ref_name || inputs.branch }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'microsoft/aspire-skills' && (github.event_name == 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted automation
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - name: Generate Aspire App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.ASPIRE_BOT_APP_ID }}
          private-key: ${{ secrets.ASPIRE_BOT_PRIVATE_KEY }}
          permission-contents: write
      - name: Refresh exact candidate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
          RELEASE_BRANCH: ${{ github.event_name == 'push' && github.ref_name || inputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e 'import {releaseVersion} from "./scripts/release-automation.mjs"; releaseVersion(process.env.RELEASE_BRANCH);'
          git fetch --no-tags origin "refs/heads/$RELEASE_BRANCH"
          source="${SOURCE_SHA:-$(git rev-parse FETCH_HEAD)}"
          node scripts/release-automation.mjs refresh "$RELEASE_BRANCH" "$source"
