name: Skill Eval

on:
  pull_request:
    paths:
      - "**/SKILL.md"
      - "**/eval.yaml"
      - ".vally.yaml"
      - ".github/workflows/skill-eval.yml"

permissions:
  contents: read

concurrency:
  group: skill-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: Run ci-gate eval suite
    runs-on: ubuntu-latest
    # The Copilot token isn't available to fork PRs (GitHub doesn't expose
    # secrets to workflows triggered by `pull_request` from a forked repo),
    # so skip the model-backed eval on those. The skill-lint workflow still
    # runs on every PR and gates wiring/schema issues without needing a token.
    if: github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name
    steps:
      # Fail-fast preflight: if the Copilot token isn't provisioned, exit
      # the job immediately (as a soft-skip, so the PR check stays green)
      # before wasting CI minutes on checkout / setup-node / install.
      # The secret must be added once on the repo as `COPILOT_GITHUB_TOKEN`
      # — see evals/README.md → "CI authentication". We don't red-X the job
      # because that would block PRs forever until a maintainer notices.
      - name: Preflight COPILOT_GITHUB_TOKEN
        id: preflight
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          if [ -z "${COPILOT_GITHUB_TOKEN:-}" ]; then
            echo "::warning title=Eval gate skipped::COPILOT_GITHUB_TOKEN secret is not configured on this repo, so the model-backed eval gate was skipped. A maintainer must add the secret (see evals/README.md → CI authentication) for the gate to run."
            {
              echo "### ⚠️ Eval gate skipped"
              echo ""
              echo "The \`COPILOT_GITHUB_TOKEN\` repository secret is not configured, so"
              echo "the model-backed \`ci-gate\` eval suite did not run on this PR."
              echo ""
              echo "**To enable the gate**, a maintainer needs to add the secret once —"
              echo "see [\`evals/README.md\` → CI authentication](../blob/${GITHUB_HEAD_REF:-main}/evals/README.md#ci-authentication)."
              echo ""
              echo "Schema and wiring are still gated by the \`Skill Lint\` workflow."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_token=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.preflight.outputs.has_token == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        if: steps.preflight.outputs.has_token == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Install vally and Copilot runtime
        if: steps.preflight.outputs.has_token == 'true'
        # Keep Vally and its native runtime under one node_modules ancestor so
        # @github/copilot-sdk can resolve the platform package.
        run: |
          tools_dir="$RUNNER_TEMP/aspire-eval-tools"
          npm install --prefix "$tools_dir" @microsoft/vally-cli @github/copilot-linux-x64
          cli_path="$tools_dir/node_modules/@github/copilot-linux-x64/index.js"
          test -f "$cli_path"
          node "$cli_path" --version
          echo "$tools_dir/node_modules/.bin" >> "$GITHUB_PATH"
          echo "COPILOT_CLI_PATH=$cli_path" >> "$GITHUB_ENV"

      - name: Determine changed skill eval specs
        id: changed
        if: steps.preflight.outputs.has_token == 'true'
        # Scope the PR gate to only the skills this PR actually touches. The
        # full suite still runs in the scheduled `Skill Eval (nightly)`
        # workflow. Beyond keeping the gate fast, this stops a PR from being
        # blocked by a flaky trial in an unrelated skill it never modified.
        #
        # A `.vally.yaml` change is the exception because its suite / tag / path
        # definitions can affect every evaluation. Gate-workflow-only changes
        # use the router spec as a runtime smoke test instead of pulling every
        # unrelated, potentially flaky skill into the PR gate.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          changed_files="$(
            gh pr diff "${{ github.event.pull_request.number }}" \
              --repo "${{ github.repository }}" --name-only
          )"

          workflow_changed=false
          if printf '%s\n' "$changed_files" \
              | grep -Eq '^\.github/workflows/skill-eval\.yml$'; then
            workflow_changed=true
          fi

          # Global suite config change -> evaluate everything.
          if printf '%s\n' "$changed_files" | grep -Eq '^\.vally\.yaml$'; then
            echo "Global eval config changed — running the full ci-gate suite."
            echo "run_full=true" >> "$GITHUB_OUTPUT"
            echo "has_specs=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run_full=false" >> "$GITHUB_OUTPUT"

          # Skills whose files changed in this PR, derived from paths of the
          # form `skills/<skill>/...` and de-duplicated.
          changed_skills="$(
            printf '%s\n' "$changed_files" \
              | sed -n 's#^skills/\([^/]*\)/.*#\1#p' \
              | sort -u
          )"

          matched=""
          for skill in $changed_skills; do
            if ! printf '%s' "$skill" | grep -Eq '^[a-z0-9][a-z0-9-]*$'; then
              echo "::error::Invalid skill directory name: $skill" >&2
              exit 1
            fi
            spec="skills/${skill}/evals/eval.yaml"
            if [ -f "$spec" ]; then
              matched="${matched} ${skill}"
            fi
          done

          if [ -z "$matched" ] && [ "$workflow_changed" = true ]; then
            matched=" aspire"
          fi

          if [ -z "$matched" ]; then
            echo "has_specs=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_specs=true" >> "$GITHUB_OUTPUT"
            echo "matched=${matched# }" >> "$GITHUB_OUTPUT"
          fi

      - name: Run full ci-gate suite (global change)
        if: steps.preflight.outputs.has_token == 'true' && steps.changed.outputs.run_full == 'true'
        # A `.vally.yaml` change landed us here. `--suite ci-gate` applies the
        # p0 + p1 priority filter across every skill. (`--suite` can't be
        # combined with `-e`, which is why the scoped path below expresses the
        # same filter with `--tag` instead.)
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          echo "Global eval config changed — evaluating the full ci-gate suite."
          vally eval \
            --suite ci-gate \
            --output-dir ./results

      - name: Run CI gate evals
        if: steps.preflight.outputs.has_token == 'true' && steps.changed.outputs.run_full == 'false' && steps.changed.outputs.has_specs == 'true'
        # COPILOT_GITHUB_TOKEN is read by @github/copilot-sdk (the vally
        # `copilot-sdk` executor) to invoke Copilot models. It is scoped to
        # this step only so install / upload never see it.
        #
        # Run each changed spec in an isolated Vally process. Vally's session
        # filesystem provider is process-global, so multiple workers can race
        # while configuring it; one worker per process avoids that race while
        # the processes still run concurrently. Apply the ci-gate-equivalent
        # p0 + p1 filter so forward-looking p2 stimuli stay out of the PR gate.
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          pids=()

          for skill in ${{ steps.changed.outputs.matched }}; do
            echo "Evaluating changed skill: $skill"
            vally eval \
              --eval-spec "skills/${skill}/evals/eval.yaml" \
              --tag priority=p0,p1 \
              --workers 1 \
              --output-dir "./results/${skill}" &
            pids+=("$!")
          done

          status=0
          for pid in "${pids[@]}"; do
            if ! wait "$pid"; then
              status=1
            fi
          done
          exit "$status"

      - name: Note no skills changed
        if: steps.preflight.outputs.has_token == 'true' && steps.changed.outputs.run_full == 'false' && steps.changed.outputs.has_specs == 'false'
        run: |
          {
            echo "### ℹ️ ci-gate eval skipped"
            echo ""
            echo "No skill eval specs (\`skills/<skill>/evals/eval.yaml\`) were modified in"
            echo "this PR, so the model-backed ci-gate had nothing to evaluate. The full"
            echo "suite still runs in the scheduled **Skill Eval (nightly)** workflow."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload trajectories
        if: always() && steps.preflight.outputs.has_token == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eval-results-ci-gate
          path: ./results/
          if-no-files-found: warn
