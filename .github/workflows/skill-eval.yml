name: Skill Eval

on:
  pull_request:
    paths:
      - "**/SKILL.md"
      - "**/eval.yaml"
      - ".vally.yaml"
      - ".github/workflows/skill-eval.yml"
      - "scripts/redact-eval-artifacts.mjs"
      - "scripts/check-eval-results.mjs"
      - "evals/grade-routing-entry.mjs"

permissions:
  contents: read

concurrency:
  group: skill-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: Run ci-gate eval suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
      copilot-requests: write
    # Fork and Dependabot PRs previously had no PAT; keep them excluded.
    # Do not replace pull_request with pull_request_target to bypass this.
    if: >-
      github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Install vally and Copilot runtime
        # Keep Vally and its native runtime under one node_modules ancestor so
        # @github/copilot-sdk can resolve the matching platform package.
        run: |
          tools_dir="$RUNNER_TEMP/aspire-eval-tools"
          npm install --ignore-scripts --prefix "$tools_dir" @microsoft/vally-cli@0.16.0 @github/copilot-linux-x64@1.0.80
          "$tools_dir/node_modules/.bin/vally" --version
          cli_path="$tools_dir/node_modules/@github/copilot-linux-x64/index.js"
          test -f "$cli_path"
          node "$cli_path" --version
          echo "$tools_dir/node_modules/.bin" >> "$GITHUB_PATH"
          echo "COPILOT_CLI_PATH=$cli_path" >> "$GITHUB_ENV"

      - name: Determine changed skill eval specs
        id: changed
        # Scope the PR gate to only the skills this PR actually touches. The
        # full suite still runs in the scheduled `Skill Eval (nightly)`
        # workflow. Beyond keeping the gate fast, this stops a PR from being
        # blocked by a flaky trial in an unrelated skill it never modified.
        #
        # A `.vally.yaml` change is the exception because its suite / tag / path
        # definitions can affect every evaluation. Gate-workflow-only changes
        # use the router spec as a runtime smoke test instead of pulling every
        # unrelated, potentially flaky skill into the PR gate.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          changed_files="$(
            gh pr diff "${{ github.event.pull_request.number }}" \
              --repo "${{ github.repository }}" --name-only
          )"

          workflow_changed=false
          if printf '%s\n' "$changed_files" \
              | grep -Eq '^(\.github/workflows/skill-eval\.yml|scripts/redact-eval-artifacts\.mjs|scripts/check-eval-results\.mjs|evals/grade-routing-entry\.mjs)$'; then
            workflow_changed=true
          fi

          # Global suite config change -> evaluate everything.
          if printf '%s\n' "$changed_files" | grep -Eq '^\.vally\.yaml$'; then
            echo "Global eval config changed — running the full ci-gate suite."
            echo "run_full=true" >> "$GITHUB_OUTPUT"
            echo "has_specs=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run_full=false" >> "$GITHUB_OUTPUT"

          # Skills whose files changed in this PR, derived from paths of the
          # form `skills/<skill>/...` and de-duplicated.
          changed_skills="$(
            printf '%s\n' "$changed_files" \
              | sed -n 's#^skills/\([^/]*\)/.*#\1#p' \
              | sort -u
          )"

          matched=""
          for skill in $changed_skills; do
            if ! printf '%s' "$skill" | grep -Eq '^[a-z0-9][a-z0-9-]*$'; then
              echo "::error::Invalid skill directory name: $skill" >&2
              exit 1
            fi
            spec="skills/${skill}/evals/eval.yaml"
            if [ -f "$spec" ]; then
              matched="${matched} ${skill}"
            fi
          done

          if [ -z "$matched" ] && [ "$workflow_changed" = true ]; then
            matched=" aspire"
          fi

          if [ -z "$matched" ]; then
            echo "has_specs=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_specs=true" >> "$GITHUB_OUTPUT"
            echo "matched=${matched# }" >> "$GITHUB_OUTPUT"
          fi

      - name: Run full ci-gate suite (global change)
        if: steps.changed.outputs.run_full == 'true'
        # A `.vally.yaml` change landed us here. `--suite ci-gate` applies the
        # p0 + p1 priority filter across every skill. (`--suite` can't be
        # combined with `-e`, which is why the scoped path below expresses the
        # same filter with `--tag` instead.)
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          unset GITHUB_TOKEN GH_TOKEN GITHUB_COPILOT_API_TOKEN
          echo "Global eval config changed — evaluating the full ci-gate suite."
          vally eval \
            --require-pass \
            --suite ci-gate \
            --output-dir ./results

      - name: Run CI gate evals
        if: steps.changed.outputs.run_full == 'false' && steps.changed.outputs.has_specs == 'true'
        # Use runtime env auth, not Vally's GITHUB_TOKEN -> SDK gitHubToken
        # user-token override. The Actions token is not a PAT.
        #
        # Run each changed spec in an isolated Vally process. Vally's session
        # filesystem provider is process-global, so multiple workers can race
        # while configuring it; one worker per process avoids that race while
        # the processes still run concurrently. Apply the ci-gate-equivalent
        # p0 + p1 filter so forward-looking p2 stimuli stay out of the PR gate.
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          unset GITHUB_TOKEN GH_TOKEN GITHUB_COPILOT_API_TOKEN
          pids=()

          for skill in ${{ steps.changed.outputs.matched }}; do
            echo "Evaluating changed skill: $skill"
            vally eval \
              --require-pass \
              --eval-spec "skills/${skill}/evals/eval.yaml" \
              --tag priority=p0,p1 \
              --workers 1 \
              --output-dir "./results/${skill}" &
            pids+=("$!")
          done

          status=0
          for pid in "${pids[@]}"; do
            if ! wait "$pid"; then
              status=1
            fi
          done
          exit "$status"

      - name: Note no skills changed
        if: steps.changed.outputs.run_full == 'false' && steps.changed.outputs.has_specs == 'false'
        run: |
          {
            echo "### ℹ️ ci-gate eval skipped"
            echo ""
            echo "No skill eval specs (\`skills/<skill>/evals/eval.yaml\`) were modified in"
            echo "this PR, so the model-backed ci-gate had nothing to evaluate. The full"
            echo "suite still runs in the scheduled **Skill Eval (nightly)** workflow."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check evaluation infrastructure
        if: ${{ !cancelled() && (steps.changed.outputs.run_full == 'true' || steps.changed.outputs.has_specs == 'true') }}
        run: |
          node scripts/check-eval-results.mjs ./results

      - name: Redact evaluation artifacts
        id: redact
        if: ${{ !cancelled() && (steps.changed.outputs.run_full == 'true' || steps.changed.outputs.has_specs == 'true') }}
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/redact-eval-artifacts.mjs ./results

      - name: Upload trajectories
        if: ${{ !cancelled() && steps.redact.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eval-results-ci-gate
          path: ./results/
          if-no-files-found: warn
