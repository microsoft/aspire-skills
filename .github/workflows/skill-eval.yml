name: Skill Eval

on:
  pull_request:
    paths:
      - "**/SKILL.md"
      - "**/eval.yaml"
      - "**/evals/tasks/*.yaml"
      - "**/trigger_tests.yaml"
      - ".vally.yaml"
      - ".github/workflows/skill-eval.yml"

permissions:
  contents: read

concurrency:
  group: skill-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: Run ci-gate eval suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout@v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node
        # actions/setup-node@v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"

      - name: Install vally CLI
        run: npm install -g @microsoft/vally-cli

      - name: Run CI gate evals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          vally eval \
            --suite ci-gate \
            --context-dir evals \
            --output-dir ./results

      - name: Upload trajectories
        if: always()
        # actions/upload-artifact@v4 (resolved 2026-06-02)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eval-results-ci-gate
          path: ./results/
          if-no-files-found: warn
