name: Skill Eval

on:
  pull_request:
    paths:
      - "**/SKILL.md"
      - "**/eval.yaml"
      - "**/evals/tasks/*.yaml"
      - "**/trigger_tests.yaml"
      - ".vally.yaml"
      - ".github/workflows/skill-eval.yml"

permissions:
  contents: read

concurrency:
  group: skill-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: Run ci-gate eval suite
    runs-on: ubuntu-latest
    # The Copilot token isn't available to fork PRs (GitHub doesn't expose
    # secrets to workflows triggered by `pull_request` from a forked repo),
    # so skip the model-backed eval on those. The skill-lint workflow still
    # runs on every PR and gates wiring/schema issues without needing a token.
    if: github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name
    steps:
      - name: Checkout
        # actions/checkout@v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node
        # actions/setup-node@v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"

      - name: Install vally CLI
        run: npm install -g @microsoft/vally-cli

      - name: Run CI gate evals
        # COPILOT_GITHUB_TOKEN is read by @github/copilot-sdk (the vally
        # `copilot-sdk` executor) to invoke Copilot models. It is scoped to
        # this step only so checkout / install / upload never see it.
        # The secret must be provisioned on the repo as `COPILOT_GITHUB_TOKEN`
        # — see evals/README.md → "CI authentication" for setup.
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          if [ -z "${COPILOT_GITHUB_TOKEN:-}" ]; then
            echo "::error::COPILOT_GITHUB_TOKEN secret is not configured on this repo. See evals/README.md → CI authentication." >&2
            exit 1
          fi
          vally eval \
            --suite ci-gate \
            --context-dir evals \
            --output-dir ./results

      - name: Upload trajectories
        if: always()
        # actions/upload-artifact@v4 (resolved 2026-06-02)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eval-results-ci-gate
          path: ./results/
          if-no-files-found: warn
