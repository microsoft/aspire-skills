name: Skill Eval

on:
  pull_request:
    paths:
      - "**/SKILL.md"
      - "**/eval.yaml"
      - "**/evals/tasks/*.yaml"
      - "**/trigger_tests.yaml"
      - ".vally.yaml"
      - ".github/workflows/skill-eval.yml"

permissions:
  contents: read

concurrency:
  group: skill-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: Run ci-gate eval suite
    runs-on: ubuntu-latest
    # The Copilot token isn't available to fork PRs (GitHub doesn't expose
    # secrets to workflows triggered by `pull_request` from a forked repo),
    # so skip the model-backed eval on those. The skill-lint workflow still
    # runs on every PR and gates wiring/schema issues without needing a token.
    if: github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name
    steps:
      - name: Checkout
        # actions/checkout@v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node
        # actions/setup-node@v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"

      - name: Install vally CLI
        run: npm install -g @microsoft/vally-cli

      - name: Run CI gate evals
        # COPILOT_GITHUB_TOKEN is read by @github/copilot-sdk (the vally
        # `copilot-sdk` executor) to invoke Copilot models. It is scoped to
        # this step only so checkout / install / upload never see it.
        # The secret must be provisioned on the repo as `COPILOT_GITHUB_TOKEN`
        # — see evals/README.md → "CI authentication" for setup.
        #
        # If the secret is missing, the step soft-skips with a warning rather
        # than red-X'ing the PR: a maintainer must add the secret once for
        # the gate to actually run. The skill-lint workflow still hard-gates
        # schema/wiring correctness without needing a token.
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          if [ -z "${COPILOT_GITHUB_TOKEN:-}" ]; then
            echo "::warning title=Eval gate skipped::COPILOT_GITHUB_TOKEN secret is not configured on this repo, so the model-backed eval gate was skipped. A maintainer must add the secret (see evals/README.md → CI authentication) for the gate to run."
            {
              echo "### ⚠️ Eval gate skipped"
              echo ""
              echo "The \`COPILOT_GITHUB_TOKEN\` repository secret is not configured, so"
              echo "the model-backed \`ci-gate\` eval suite did not run on this PR."
              echo ""
              echo "**To enable the gate**, a maintainer needs to add the secret once —"
              echo "see [\`evals/README.md\` → CI authentication](../blob/${GITHUB_HEAD_REF:-main}/evals/README.md#ci-authentication)."
              echo ""
              echo "Schema and wiring are still gated by the \`Skill Lint\` workflow."
            } >> "$GITHUB_STEP_SUMMARY"
            mkdir -p ./results
            echo '{"skipped":"COPILOT_GITHUB_TOKEN not configured"}' > ./results/skipped.json
            exit 0
          fi
          vally eval \
            --suite ci-gate \
            --context-dir evals \
            --output-dir ./results

      - name: Upload trajectories
        if: always()
        # actions/upload-artifact@v4 (resolved 2026-06-02)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eval-results-ci-gate
          path: ./results/
          if-no-files-found: warn
