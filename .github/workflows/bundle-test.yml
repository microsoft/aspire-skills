name: Bundle Tests

on:
  pull_request:
    paths:
      - ".gitattributes"
      - ".github/workflows/bundle-test.yml"
      - ".github/workflows/publish.yml"
      - "hooks/**"
      - "package.json"
      - "scripts/**"
      - "tests/**"
  push:
    branches:
      - main
    paths:
      - ".gitattributes"
      - ".github/workflows/bundle-test.yml"
      - ".github/workflows/publish.yml"
      - "hooks/**"
      - "package.json"
      - "scripts/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  test:
    name: Test and build bundles
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        # actions/checkout@v6.0.2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Node
        # actions/setup-node@v6.4.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Test
        run: npm test

      - name: Build release-equivalent bundles
        run: >-
          npm run bundle --
          --out dist
          --source-commit "$(git rev-parse 'HEAD^{commit}')"
