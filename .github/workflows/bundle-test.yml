name: Bundle Tests

on:
  pull_request:
    paths:
      - ".gitattributes"
      - ".github/workflows/bundle-test.yml"
      - ".github/workflows/publish.yml"
      - ".github/workflows/skill-eval*.yml"
      - ".github/workflows/skill-experiment.yml"
      - ".github/plugins/aspire-skills/extensions/**"
      - "extensions/**"
      - "hooks/**"
      - "package.json"
      - "package-lock.json"
      - ".plugin/plugin.json"
      - ".claude-plugin/plugin.json"
      - ".claude-plugin/marketplace.json"
      - ".cursor-plugin/marketplace.json"
      - "gemini-extension.json"
      - "evals/project-v2-migration/**"
      - "evals/grade-routing-entry.mjs"
      - "skills/*/SKILL.md"
      - "skills/aspire-project-v2-migration/**"
      - "scripts/**"
      - "tests/**"
  push:
    branches:
      - main
      - dev
      - release/**
    paths:
      - ".gitattributes"
      - ".github/workflows/bundle-test.yml"
      - ".github/workflows/publish.yml"
      - ".github/workflows/skill-eval*.yml"
      - ".github/workflows/skill-experiment.yml"
      - ".github/plugins/aspire-skills/extensions/**"
      - "extensions/**"
      - "hooks/**"
      - "package.json"
      - "package-lock.json"
      - ".plugin/plugin.json"
      - ".claude-plugin/plugin.json"
      - ".claude-plugin/marketplace.json"
      - ".cursor-plugin/marketplace.json"
      - "gemini-extension.json"
      - "evals/project-v2-migration/**"
      - "evals/grade-routing-entry.mjs"
      - "skills/*/SKILL.md"
      - "skills/aspire-project-v2-migration/**"
      - "scripts/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  test:
    name: Test and build bundles
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        # actions/checkout@v6.0.2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Node
        # actions/setup-node@v6.4.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"

      - name: Install test dependencies
        run: npm ci --ignore-scripts

      - name: Test
        run: npm test

      - name: Build release-equivalent bundles
        run: >-
          npm run bundle --
          --out dist
          --source-commit "$(git rev-parse 'HEAD^{commit}')"
