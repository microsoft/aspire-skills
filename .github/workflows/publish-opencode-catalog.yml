name: Publish OpenCode catalog

on:
  push:
    branches:
      - main
    paths:
      - "skills/**"
      - "scripts/build-opencode-catalog.mjs"
      - "tests/opencode-catalog.test.mjs"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opencode-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'microsoft/aspire-skills' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check publishing permissions
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail

          for actor in "$ACTOR" "$TRIGGERING_ACTOR"; do
            permission=$(gh api "repos/${REPOSITORY}/collaborators/${actor}/permission" --jq '.permission')
            case "$permission" in
              write|maintain|admin)
                echo "${actor} is authorized to publish (${permission})."
                ;;
              *)
                echo "::error::${actor} requires write, maintain, or admin repository permission to publish."
                exit 1
                ;;
            esac
          done

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Test catalog generator
        run: node --test tests/opencode-catalog.test.mjs

      - name: Build catalog and index
        run: npm run catalog

      - name: Check catalog
        run: npm run catalog:check

      - name: Check Pages artifact scope
        run: >-
          node --input-type=module -e
          'import assert from "node:assert/strict";
          import { readdirSync } from "node:fs";
          assert.deepEqual(readdirSync("dist"), ["opencode"], "Only the catalog may be published");'

      - name: Upload catalog only
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    if: github.repository == 'microsoft/aspire-skills' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.catalog.outputs.url }}
    steps:
      - name: Deploy catalog
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Set catalog URL
        id: catalog
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: echo "url=${PAGE_URL%/}/opencode/v2/" >> "$GITHUB_OUTPUT"
