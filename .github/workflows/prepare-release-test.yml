name: Test release preparation

on:
  push:
    branches: [ellahathaway-release-catalog-automation]

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'microsoft/aspire-skills'
    uses: ./.github/workflows/prepare-release.yml
    with:
      source: c04950a72509426059081fca518797194025acd1
      version: 0.0.6
      next_version: 0.0.7
    secrets:
      ASPIRE_BOT_APP_ID: ${{ secrets.ASPIRE_BOT_APP_ID }}
      ASPIRE_BOT_PRIVATE_KEY: ${{ secrets.ASPIRE_BOT_PRIVATE_KEY }}
