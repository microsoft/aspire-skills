updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      github-actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "github/gh-aw-actions/**" # Managed by gh aw compile; version-locked to the compiler.
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "npm"
    directory: "/"
    groups:
      npm:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
version: 2
