id: init-cli-install-001
name: Suggest CLI Install if Aspire CLI Is Missing
description: >
  Agent is asked to run `aspire init` but the Aspire CLI is not installed. It should
  suggest one of the supported install paths: the `dotnet tool install -g Aspire.Cli`
  NativeAOT global tool (.NET 10) OR the curl/PowerShell installer from
  `https://aspire.dev/install.sh`. It must NOT suggest the obsolete
  `dotnet workload install aspire`.
tags:
  - prerequisites
  - p1

inputs:
  prompt: "I tried `aspire init` but it says command not found. How do I install the Aspire CLI?"
  files:
    - path: "non-aspire/MyApp/api/MyApi.csproj"
    - path: "non-aspire/MyApp/api/Program.cs"

expected:
  output_contains:
    - "Aspire.Cli"
  output_not_contains:
    - "dotnet workload install aspire"

graders:
  - name: suggests_supported_install
    type: prompt
    config:
      prompt: >
        Does the response suggest at least one of the two supported Aspire CLI install
        paths in 13.3?
        (1) `dotnet tool install -g Aspire.Cli` — the NativeAOT .NET 10 global tool, OR
        (2) `curl -sSL https://aspire.dev/install.sh | bash` — the curl installer.
        Either is acceptable; ideally the response mentions both and notes that the
        global-tool path requires .NET 10.
  - name: no_obsolete_workload
    type: text
    config:
      not_contains:
        - "dotnet workload install aspire"
        - "dotnet workload install Aspire"
  - name: mentions_doctor_or_prereqs
    type: prompt
    config:
      prompt: >
        After installing the CLI, does the response also tell the user how to verify
        the install (for example, `aspire doctor`, `aspire --version`, or re-running
        `aspire init`)? Light mention is acceptable.
