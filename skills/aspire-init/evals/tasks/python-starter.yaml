id: init-py-001
name: Python Starter Uses `aspire new aspire-py-starter` (Not `dotnet new`)
description: >
  Agent is asked to scaffold a Python (FastAPI + React) starter. In Aspire 13.3, the
  Python starter uses `aspire new aspire-py-starter` and a TypeScript AppHost — the
  legacy `dotnet new aspire-py-starter` template was removed. It should also know about
  the `--use-redis-cache` template option.
tags:
  - core-flow
  - p0
  - 13.3-breaking

inputs:
  prompt: "Scaffold an Aspire FastAPI + React Python starter, and please include Redis."
  files: []

expected:
  output_contains:
    - "aspire new aspire-py-starter"
    - "--use-redis-cache"
  output_not_contains:
    - "dotnet new aspire-py-starter"

graders:
  - name: uses_aspire_new_py_starter
    type: prompt
    config:
      prompt: >
        Does the response use `aspire new aspire-py-starter` (the Aspire 13.3 path) and
        NOT `dotnet new aspire-py-starter` (which was removed in 13.3)? It should also
        explain that the AppHost will be TypeScript and orchestrates the Python service.
  - name: includes_redis_flag
    type: prompt
    config:
      prompt: >
        Since the user asked for Redis, the response should include the
        `--use-redis-cache true` template option (or note that this option exists for the
        py-starter template).
  - name: no_dotnet_new
    type: text
    config:
      not_contains:
        - "dotnet new aspire-py-starter"
        - "dotnet new aspire-py"
