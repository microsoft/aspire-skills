id: mon-azure-001
name: Route Deployed Azure App to azure-diagnostics
description: >
  Agent should route deployed Azure app diagnostics to azure-diagnostics skill,
  not try to use aspire CLI.
tags:
  - routing
  - deployed
  - p0

inputs:
  prompt: "My app is deployed to Azure Container Apps and I'm seeing 500 errors. Help me debug."
  files:
    - path: "csharp-apphost"
  context:
    environment: deployed
    target: azure

expected:
  output_contains:
    - "azure-diagnostics"
  output_not_contains:
    - "aspire logs"
    - "aspire describe"

graders:
  - name: routes_to_azure_diagnostics
    type: prompt
    config:
      prompt: >
        Does the response route the user to azure-diagnostics, App Insights, or
        platform-specific Azure monitoring tools for the deployed app? Answer based
        on the intent, not exact string matching.
      threshold: 0.6
  - name: no_local_commands
    type: text
    config:
      not_contains:
        - "aspire logs"
        - "aspire describe"
  - name: explains_why
    type: prompt
    config:
      prompt: >
        The response should explain that Aspire CLI cannot connect to deployed apps
        (local backchannel only) and route to azure-diagnostics skill or App Insights.
      threshold: 0.7
