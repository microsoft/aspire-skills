id: mon-logs-001
name: View Local Application Logs
description: >
  Agent should use aspire CLI for local log viewing, not manual file reading.
tags:
  - local-diagnostics
  - p0

inputs:
  prompt: "Show me what the API service is logging"
  files:
    - path: "csharp-apphost/MyApp.AppHost/MyApp.AppHost.csproj"
    - path: "csharp-apphost/MyApp.AppHost/Program.cs"
    - path: "csharp-apphost/aspire.config.json"
  context:
    aspire_running: true
    environment: local

expected:
  output_contains:
    - "aspire logs"

graders:
  - name: uses_aspire_logs
    type: prompt
    config:
      prompt: >
        Does the response recommend using 'aspire logs' (or an equivalent Aspire CLI
        log viewing command) to view application logs locally? Answer based on the
        intent, not exact string matching.
  - name: not_manual_logs
    type: text
    config:
      not_contains:
        - "cat"
        - "tail -f"
        - "docker logs"
