id: mon-docker-001
name: Route Docker Compose Deployed App
description: >
  Agent should route Docker Compose deployed apps to docker CLI, not aspire CLI.
tags:
  - routing
  - deployed
  - p1

inputs:
  prompt: "Check the logs for my service running in Docker Compose"
  context:
    environment: deployed
    target: docker-compose

expected:
  output_contains:
    - "docker"

graders:
  - name: uses_docker
    type: prompt
    config:
      prompt: >
        Does the response recommend using Docker CLI commands (docker logs, docker compose
        logs, etc.) to check logs for a service running in Docker Compose? Answer based
        on the intent, not exact string matching.
      threshold: 0.6
  - name: not_aspire_cli
    type: text
    config:
      not_contains:
        - "aspire logs"
