id: mon-otel-001
name: View OpenTelemetry Traces
description: >
  Agent should use aspire otel traces for distributed tracing locally.
tags:
  - local-diagnostics
  - p0

inputs:
  prompt: "I need to trace a request across my services to find the bottleneck"
  context:
    aspire_running: true
    environment: local

expected:
  output_contains:
    - "aspire otel traces"

graders:
  - name: uses_otel_traces
    type: prompt
    config:
      prompt: >
        Does the response recommend using 'aspire otel traces' (or an equivalent
        Aspire CLI distributed tracing command) for cross-service trace analysis?
        Answer based on the intent, not exact string matching.
      threshold: 0.6
  - name: structured_first
    type: prompt
    config:
      prompt: >
        The response should prefer structured telemetry (aspire otel traces) over
        raw console logs (aspire logs). It should recommend checking traces first
        for cross-service analysis, then logs for detail.
      threshold: 0.7
