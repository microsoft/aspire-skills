id: mon-export-001
name: Export Telemetry Bundle
description: >
  Agent should use 'aspire export' for portable diagnostics bundles.
tags:
  - local-diagnostics
  - p1

inputs:
  prompt: "I need to share the diagnostic data with another team member"
  files:
    - path: "csharp-apphost"
  context:
    aspire_running: true
    environment: local

expected:
  output_contains:
    - "aspire export"

graders:
  - name: uses_export
    type: prompt
    config:
      prompt: >
        Does the response recommend using 'aspire export' (or an equivalent Aspire CLI
        command for creating portable diagnostics bundles) to share diagnostic data?
        Answer based on the intent, not exact string matching.
      threshold: 0.6
