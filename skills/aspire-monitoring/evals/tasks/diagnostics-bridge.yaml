id: mon-bridge-001
name: Diagnostics Bridge Decision (three-way)
description: >
  Agent should correctly route between local Aspire CLI, AKS workload tooling
  (kubectl + Container Insights), Azure resource health (azure-diagnostics),
  and Docker tooling based on where the app is running. Plus AppHost code/
  deployment definition routes to aspire-deployment.
tags:
  - routing
  - p0

inputs:
  prompt: "How do I check what's going on with my application?"
  files:
    - path: "csharp-apphost/MyApp.AppHost/MyApp.AppHost.csproj"
    - path: "csharp-apphost/MyApp.AppHost/Program.cs"
    - path: "csharp-apphost/aspire.config.json"

graders:
  - name: explains_three_way_routing
    type: prompt
    config:
      prompt: >
        The response should ask or determine where the app is running and route
        to the correct tooling. Specifically it should distinguish at least three
        deployed targets:
        (1) local dev → aspire CLI (aspire describe, aspire logs, aspire otel),
        (2) AKS / Kubernetes workload → kubectl + Container Insights for pod
            logs and workload state,
        (3) other Azure resource health → azure-diagnostics (App Insights,
            Front Door, NSP, private endpoint, App Service / Container Apps),
        and ideally also Docker/Compose → docker logs.
        AppHost code or deployment definition questions should route to
        aspire-deployment (and aspireify for code edits).
        The response should NOT suggest aspire logs for deployed apps and
        should NOT collapse AKS into a generic "Azure" bucket.
  - name: no_local_for_deployed
    type: text
    config:
      not_contains:
        - "aspire logs <pod>"
