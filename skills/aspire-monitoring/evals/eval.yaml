name: aspire-monitoring-eval
description: Evaluates the aspire-monitoring skill for correct diagnostics routing between local
  Aspire CLI and deployed platform-specific tools. Tests the bridge logic that is the skill's
  primary value.
version: "1.0"
type: capability
tags:
  skill: aspire-monitoring
defaults:
  runs: 3
  # Per-trial wall-clock budget. Kept generous because runs >= 2 disables
  # vally's timeout/rate-limit retries, so one slow trial would hard-fail the
  # whole eval (evalHadExecutionErrors) even when the aggregate score passes.
  timeout: 600s
  executor: copilot-sdk
  model: gpt-5-mini
  judge_model: gpt-5.6-sol
scoring:
  # Score each stimulus by the weighted share of graders that pass, then gate on
  # the aggregate (>= threshold) instead of demanding every grader pass on every
  # trial. This absorbs gpt-5-mini nondeterminism and graders that look for code
  # tokens the agent writes into edited files rather than its chat message;
  # genuine regressions still drag the aggregate below the bar.
  threshold: 0.7
environment:
  # vally 0.8.0 loads no skills unless declared here (paths resolve relative to
  # this eval file). aspire-monitoring is self-contained in-repo (its other
  # INVOKES targets — azure-diagnostics, kubectl — are external to this plugin).
  skills:
    - ../../aspire-monitoring
grading_environment:
  files:
    - { src: ../../../evals/large-systems/grade-incident.mjs, dest: .grader/grade-incident.mjs }
    - { src: ../../../evals/large-systems/incident-contract.mjs, dest: .grader/incident-contract.mjs }
stimuli:
  - name: mon-large-target-collision
    prompt: |
      Before answering, invoke the matching available Aspire skill or skills.
      Read response-contract.md, topology.json and incident.json with file-reading
      tools. Analytics API is slow, but Commerce has louder errors. Diagnose the
      requested target from this offline evidence, not the noisiest AppHost.
      Return only the response-contract JSON; do not execute commands or edit files.
    tags: { priority: p0, area: [large-systems, multi-apphost], incident: target-collision }
    constraints: { max_agent_duration: 150s }
    environment:
      files:
        - &large-topology { src: ../../../evals/large-systems/topology.json, dest: topology.json }
        - &incident-response { src: ../../../evals/large-systems/response-contract.md, dest: response-contract.md }
        - { src: ../../../evals/large-systems/incidents/target-collision.json, dest: incident.json }
    rubric:
      - The assistant's response attributes Analytics API latency to its worker report-query timeout using analytics-latency and analytics-worker.
      - The assistant's response excludes Commerce authentication and Sandbox health from the requested diagnosis.
      - The assistant's response proposes Analytics-scoped state inspection and logs correlated to the full trace ID, either across the trace or scoped to its implicated worker, without claiming a fix succeeded.
    graders:
      - type: diff-empty
      - type: program
        name: large-target-collision-contract
        config: { program: node, args: [.grader/grade-incident.mjs, target-collision] }
      - type: prompt
        name: large-target-collision-diagnosis
        config: { scoring: binary }

  - name: mon-large-ambiguous-target
    prompt: |
      Before answering, invoke the matching available Aspire skill or skills.
      Read response-contract.md, topology.json and incident.json with file-reading
      tools. The api is failing in a workspace with several AppHosts; I have not
      identified the application. Do not pick an AppHost or restart anything.
      Return only the offline response-contract JSON; do not execute commands or edit files.
    tags: { priority: p0, area: [large-systems, multi-apphost], incident: ambiguous-target }
    constraints: { max_agent_duration: 150s }
    environment:
      files:
        - *large-topology
        - *incident-response
        - { src: ../../../evals/large-systems/incidents/ambiguous-target.json, dest: incident.json }
    rubric:
      - The assistant's response recognizes that all three AppHosts contain api and the reported failure does not identify one exact target.
      - The assistant's response requests exact AppHost clarification through unknowns, with null AppHost/cause and no command proposals or restart.
    graders:
      - type: diff-empty
      - type: program
        name: large-ambiguous-target-contract
        config: { program: node, args: [.grader/grade-incident.mjs, ambiguous-target] }
      - type: prompt
        name: large-ambiguous-target-diagnosis
        config: { scoring: binary }

  - name: mon-large-dependency-fanout
