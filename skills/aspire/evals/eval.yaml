name: aspire-router-eval
description: Read-only Aspire routing assessments with actual skill activation, explicit outcome rubrics, and unchanged-workspace checks. Execution belongs to the owning skill's capability evaluations.
version: "1.0"
type: capability
tags: { skill: aspire }
defaults:
  runs: 3
  timeout: 600s
  executor: copilot-sdk
  model: gpt-5-mini
  judge_model: gpt-5.6-sol-fast
scoring:
  threshold: 0.7
environment:
  skills:
    - ../../aspire
    - ../../aspire-init
    - ../../aspireify
    - ../../aspire-project-v2-migration
    - ../../aspire-orchestration
    - ../../aspire-deployment
    - ../../aspire-monitoring
grading_environment:
  files:
    - { src: ../../../evals/grade-routing-entry.mjs, dest: .grader/grade-routing-entry.mjs }

# These cases judge routing, not successful deployment, live diagnostics or edits.
# Natural trigger prompts do not name the skill to invoke. Clear requests require
# the actual owning specialist; explicit/broad router requests still require aspire.
# A plausible answer without an accepted skill activation is not enough.
stimuli:
  - name: router-ordinary-wiring-preserves-136-001
    prompt: >
      Use the aspire router skill. This existing C# AppHost centrally selects
      AspireVersion 13.6.0-dev. Give read-only guidance for ordinary Redis wiring,
      preserving that release family. Do not edit, restore, start, deploy, run
      cloud commands, or migrate Project resources.
    tags: { priority: p1, scenario: version-compatibility, area: version-preservation }
    constraints: { max_agent_duration: 5m }
    environment:
      files:
        - { src: ../../../evals/project-v2-migration/runnable-csharp, dest: app }
    rubric:
      - The assistant routes ordinary wiring through aspireify, retaining the aspire router.
      - The assistant preserves 13.6.0-dev without pinning 13.5.3, implicitly upgrading/downgrading, or initiating Project v2 migration.
      - The assistant provides read-only guidance without claiming unperformed validation.
    graders:
      - type: prompt
        name: preserves-selected-136-family
        config: { scoring: binary }
      - type: skill-invocation
        name: invokes-router-not-project-v2-migration
        config: { required: [aspire, aspireify], disallowed: [aspire-project-v2-migration] }
      - type: diff-empty
        name: keeps-read-only-workspace-unchanged

  - name: router-init-001
    prompt: >
      I want better AI agent support for my Aspire project. Give read-only
      advice: which project-local guidance should I generate, and what does it
      cover? Do not generate files, install tools or run setup commands.
    tags: { priority: p1, area: recommendation }
    environment:
      files: &csharp_apphost
        - { src: ../../../evals/csharp-apphost/MyApp.AppHost/MyApp.AppHost.csproj, dest: csharp-apphost/MyApp.AppHost/MyApp.AppHost.csproj }
        - { src: ../../../evals/csharp-apphost/MyApp.AppHost/Program.cs, dest: csharp-apphost/MyApp.AppHost/Program.cs }
        - { src: ../../../evals/csharp-apphost/aspire.config.json, dest: csharp-apphost/aspire.config.json }
    rubric:
      - The response recommends aspire agent init for project-local Aspire skills, not generic Copilot CI or cloud-agent setup.
      - The response explains richer C# AppHost editing, TypeScript AppHost and investigation/diagnostics guidance.
      - Guidance is sufficient; generating files or executing setup is neither required nor permitted.
    graders:
      - type: skill-invocation
        name: invokes-router-for-agent-guidance
        config: { required: [aspire] }
      - type: prompt
        name: recommends-agent-init
        config: { scoring: binary }
      - type: diff-empty

  - name: router-reject-001
    prompt: >
      How do I run this .NET console app? Give read-only guidance; do not build,
      run, install tools or change files.
    tags: { priority: p1, area: routing }
    environment:
      files:
        - { src: ../../../evals/non-aspire/MyApp/MyApp.csproj, dest: non-aspire/MyApp/MyApp.csproj }
        - { src: ../../../evals/non-aspire/MyApp/Program.cs, dest: non-aspire/MyApp/Program.cs }
    rubric:
      - The response recognizes a normal .NET project without Aspire.AppHost.Sdk and recommends dotnet run.
      - It does not apply Aspire lifecycle requirements or recommend Aspire commands for this project; explaining why Aspire is inapplicable is allowed.
      - No execution is needed to answer this read-only question.
    graders:
      - type: skill-invocation
        name: does-not-route-console-app-to-aspire
        config: { disallowed: [aspire] }
      - type: prompt
        name: uses-dotnet-not-aspire
        config: { scoring: binary }
      - type: diff-empty

  - name: router-azdiag-001
    prompt: >
      My Aspire app is deployed to Azure and users report errors. Give read-only
      guidance on the diagnostic route and the limitations of local Aspire
      tooling. Do not query Azure, start an AppHost or change files.
    tags: { priority: p0, area: routing }
    environment: { files: *csharp_apphost }
    rubric:
      - Either the aspire router's deployed-diagnostics handoff or the aspire-monitoring bridge is a valid actual entry; naming a skill without activating one is insufficient.
      - The response routes deployed-app diagnostics to azure-diagnostics or appropriate Azure platform tools, requesting target details if needed.
      - It explains that Aspire CLI diagnostics use a local AppHost backchannel, not deployed Azure resources, and does not recommend local commands to query the deployment.
      - An unavailable external skill may be named as the required handoff, but must not be claimed as invoked. Explaining why local commands are unsuitable is allowed.
      - This is routing guidance; live queries or a completed incident diagnosis are neither required nor permitted.
    graders:
      - type: program
        name: accepts-deployed-diagnostic-entry
        config:
          program: node
          args: [.grader/grade-routing-entry.mjs, aspire, aspire-monitoring]
      - type: prompt
        name: routes-to-azure-diagnostics
        config: { scoring: binary }
      - type: diff-empty

  - name: router-deploy-001
    prompt: >
      I'm ready to deploy my Aspire app to production on Azure. Give read-only
      guidance on the owning workflow, deployment command and decisions needed
      before execution. Do not publish, deploy, provision, install or edit.
    tags: { priority: p0, area: routing }
    environment: { files: *csharp_apphost }
    rubric:
      - The response routes to aspire-deployment and identifies aspire deploy as the deployment workflow.
      - It requests missing target/scope information or approvals as needed; it does not replace the Aspire workflow with azd or generic Azure provisioning.
      - Read-only planning is the requested outcome. A deployed application is not required, and no deployment or provisioning is permitted.
    graders:
      - type: skill-invocation
        name: invokes-deployment-owner
        config: { required: [aspire-deployment] }
      - type: prompt
        name: routes-to-deployment
        config: { scoring: binary }
      - type: diff-empty

  - name: router-mon-001
    prompt: >
      Something is wrong with my locally running Aspire app. Give read-only
      advice on how to see what is happening before changing code. Do not query
      running resources, start the app or edit files.
    tags: { priority: p0, area: routing }
    environment: { files: *csharp_apphost }
    rubric:
      - The response routes to aspire-monitoring and recommends aspire describe for resource state, followed by aspire logs or structured OTEL diagnostics.
      - It prioritizes runtime investigation over dotnet build, dotnet run or speculative edits.
      - It explains the workflow without claiming to inspect actual resources; execution and a completed diagnosis are not required.
    graders:
      - type: skill-invocation
        name: invokes-monitoring-owner
        config: { required: [aspire-monitoring] }
      - type: prompt
        name: routes-to-monitoring
        config: { scoring: binary }
      - type: diff-empty

  - name: router-orch-001
    prompt: >
      Use the aspire router skill before answering. In VS Code,
      aspire_apphost_start is available as a deferred tool. I need to start my
      Aspire app without a debugger and then wait for the database. Give read-only
      guidance: state the route, exact lifecycle tool and mode, and readiness
      command. Do not perform either action or edit files.
    tags: { priority: p0, area: routing, scenario: lifecycle-tools }
    environment: { files: *csharp_apphost }
    rubric:
      - The response routes lifecycle work to aspire-orchestration.
      - It identifies aspire_apphost_start in run mode, followed by aspire wait for database readiness, rather than manual HTTP polling.
      - The scenario provides the deferred tool's availability as context; actual lifecycle-tool invocation is neither required nor permitted in this read-only assessment.
    graders:
      - type: skill-invocation
        name: required-skills-router-orch-001
        config: { required: [aspire, aspire-orchestration] }
      - type: prompt
        name: routes-correctly
        config: { scoring: binary }
      - type: diff-empty

  - name: router-package-manager-001
    prompt: >
      Use the aspire router skill before answering. A generated TypeScript
      AppHost cannot restore dependencies, and its repository uses pnpm. Give
      read-only guidance on the skill that owns diagnosis and the lifecycle
      command to start it afterward. Do not restore, install, launch or edit.
    tags: { priority: p1, area: [routing, package-manager-routing] }
    rubric:
      - The response assigns TypeScript AppHost package-manager diagnosis to aspireify and keeps normal AppHost execution on aspire start.
      - It preserves the repository's pnpm ownership and does not substitute a raw package-manager launcher for the Aspire lifecycle.
      - Explaining the handoff is sufficient; an actual restore or launch is not required or permitted.
    graders:
      - type: skill-invocation
        name: required-skills-router-package-manager-001
        config: { required: [aspire, aspireify] }
      - type: prompt
        name: routes-package-manager-repair
        config: { scoring: binary }
      - type: diff-empty

  - name: router-legacy-ts-migrate-135-001
    prompt: >
      My old TypeScript AppHost still uses apphost.ts. Give read-only migration
      guidance: which workflow owns it, what does it change, and what approval
      is needed? Do not migrate, update packages, run commands or edit files.
    tags: { priority: p1, area: [routing, aspire-13-5, typescript-migration] }
    constraints: { max_agent_duration: 5m }
    rubric:
      - The response assigns aspire update --migrate to aspire-orchestration, not ordinary aspireify authoring or Project v2 resource migration.
      - It explains package, config, tsconfig, generated-import and entry-point changes and requires approval before --yes --non-interactive execution.
      - Aspireify is a later handoff only if source authoring remains. No actual migration is needed or permitted for this assessment.
    graders:
      - type: skill-invocation
        name: invokes-orchestration
        config:
          required: [aspire-orchestration]
          disallowed: [aspireify, aspire-project-v2-migration]
      - type: prompt
        name: routes-migration-to-orchestration
        config: { scoring: binary }
      - type: diff-empty

  - name: should_trigger_01
    description: Direct Aspire CLI invocation
    prompt: >
      How do I run my AppHost with aspire start? Give read-only guidance; do not
      start anything, install tools or edit files.
    tags: { priority: p1, area: routing }
    rubric:
      - The response recognizes an Aspire lifecycle task and explains aspire start through aspire-orchestration rather than plain dotnet run.
      - AppHost identification and noninteractive/worktree-isolated execution are explained where applicable; missing local tools do not prevent giving guidance.
      - No actual start, install or edit is needed or permitted.
    graders:
      - type: skill-invocation
        name: required-skills-should-trigger-01
        config: { required: [aspire-orchestration] }
      - type: prompt
        name: engages-aspire-start
        config: { scoring: binary }
      - type: diff-empty

  - name: should_trigger_02
    description: Aspire deployment lifecycle
    prompt: >
      How should I deploy my Aspire distributed app? Give read-only guidance on
      the workflow and necessary target decisions; do not publish, deploy,
      provision, install tools or edit files.
    tags: { priority: p1, area: routing }
    rubric:
      - The response engages aspire-deployment and explains aspire deploy, rather than replacing it with raw azd or a non-Aspire workflow.
      - Missing AppHost or target details may require clarification before execution, but the response still identifies the deployment route.
      - Actual deployment is not required and must not be attempted.
    graders:
      - type: skill-invocation
        name: required-skills-should-trigger-02
        config: { required: [aspire-deployment] }
      - type: prompt
        name: engages-aspire-deploy
        config: { scoring: binary }
      - type: diff-empty

  - name: should_trigger_03
    description: Aspire monitoring
    prompt: >
      How should I check the aspire logs from my AppHost resources? Give
      read-only advice; do not inspect running resources, start anything,
      install tools or edit files.
    tags: { priority: p1, area: routing }
    rubric:
      - The response engages aspire-monitoring and explains Aspire logs/resource-state or structured OTEL diagnostics, not generic logging alone.
      - Missing local CLI or running resources does not make a routing explanation incomplete; do not require actual log retrieval.
      - No live inspection, installation or edits are permitted.
    graders:
      - type: skill-invocation
        name: required-skills-should-trigger-03
        config: { required: [aspire-monitoring] }
      - type: prompt
        name: engages-aspire-diagnostics
        config: { scoring: binary }
      - type: diff-empty

  - name: should_trigger_04
    description: AppHost detection via SDK reference
    prompt: >
      I have an Aspire.AppHost.Sdk project. How do I run it? Give read-only
      guidance; do not run, install or edit anything.
    tags: { priority: p1, area: routing }
    rubric:
      - The response recognizes Aspire.AppHost.Sdk as an AppHost and routes lifecycle guidance to aspire-orchestration.
      - It recommends the Aspire lifecycle, such as aspire start or the appropriate editor tool, not a generic dotnet run fallback.
      - Guidance is sufficient; actual execution is neither required nor permitted.
    graders:
      - type: skill-invocation
        name: required-skills-should-trigger-04
        config: { required: [aspire-orchestration] }
      - type: prompt
        name: engages-aspire-run
        config: { scoring: binary }
      - type: diff-empty

  - name: should_trigger_05
    description: Aspire CLI overview
    prompt: >
      How do I use the aspire CLI? Give a read-only overview; do not run commands,
      install tools or change files.
    tags: { priority: p1, area: routing }
    rubric:
      - The response identifies Aspire and provides a coherent CLI overview using relevant commands such as aspire start, aspire new/init, aspire add, aspire describe or aspire deploy.
      - This broad overview may be answered by the router; it must not install tools, scaffold a project or execute the suggested commands.
    graders:
      - type: skill-invocation
        name: required-skills-should-trigger-05
        config: { required: [aspire] }
      - type: prompt
        name: provides-aspire-cli-guidance
        config: { scoring: binary }
      - type: diff-empty

  - name: should_trigger_06
    description: Aspire integration wiring
    prompt: >
      How should I add Redis to my cloud-native Aspire app? Give read-only
      guidance; do not edit the AppHost, install packages, restore or start it.
    tags: { priority: p1, area: routing }
    rubric:
      - The response routes ordinary integration wiring to aspireify and explains an AppHost Redis resource and the consuming service's reference.
      - It does not substitute only a raw Redis client or require Project v2 migration. Missing language/path details may be requested before authoring.
      - Completed source changes or a running Redis instance are not required or permitted.
    graders:
      - type: skill-invocation
        name: required-skills-should-trigger-06
        config: { required: [aspireify] }
      - type: prompt
        name: engages-aspire-integration-wiring
        config: { scoring: binary }
      - type: diff-empty

  - name: should_trigger_07
    description: TypeScript AppHost detection
    prompt: >
      My apphost.mts file needs updating. Give read-only guidance on the owning
      workflow and what information is needed before edits; do not update,
      restore, install or run it.
    tags: { priority: p1, area: routing }
    rubric:
      - The response recognizes a current TypeScript Aspire AppHost and routes ordinary source authoring to aspireify.
      - Asking for its path, contents or desired change is appropriate when missing; the filename alone does not request Project v2 migration.
      - No actual update is required or permitted.
    graders:
      - type: skill-invocation
        name: required-skills-should-trigger-07
        config: { required: [aspireify] }
      - type: prompt
        name: engages-typescript-apphost
        config: { scoring: binary }
      - type: diff-empty

  - name: should_trigger_08
    description: Aspire environment diagnostics
    prompt: >
      How do I run aspire doctor to check my setup? Give read-only guidance;
      do not run diagnostics, install tools or change files.
    tags: { priority: p1, area: routing }
    rubric:
      - The response engages aspire-orchestration and explains aspire doctor as Aspire environment/toolchain diagnostics.
      - It does not treat this as unrelated to Aspire or require executing diagnostics to answer; no diagnostic run or installation is permitted.
    graders:
      - type: skill-invocation
        name: required-skills-should-trigger-08
        config: { required: [aspire-orchestration] }
      - type: prompt
        name: engages-aspire-doctor
        config: { scoring: binary }
      - type: diff-empty

  - name: should_trigger_09
    description: Adding Aspire to a repository
    prompt: >
      How do I run aspire init to add Aspire to this repo? Give read-only
      guidance; do not scaffold, install tools or edit files.
    tags: { priority: p1, area: routing }
    rubric:
      - The response routes first-run setup to aspire-init and explains aspire init for adding the skeleton to an existing repository.
      - It distinguishes subsequent AppHost wiring through aspireify from the first-run operation.
      - Actual scaffolding is not required or permitted.
    graders:
      - type: skill-invocation
        name: required-skills-should-trigger-09
        config: { required: [aspire-init] }
      - type: prompt
        name: engages-aspire-init
        config: { scoring: binary }
      - type: diff-empty

  - name: should_trigger_10
    description: Aspire deployment teardown
    prompt: >
      How do I run aspire destroy to tear down my deployment? Give read-only
      guidance on the workflow and confirmation boundary; do not destroy
      resources, run deployment commands or change files.
    tags: { priority: p1, area: routing }
    rubric:
      - The response routes teardown to aspire-deployment and explains aspire destroy for an exact deployment.
      - It requires confirmation of the destructive scope before execution and does not substitute local AppHost stop or an unrelated container teardown.
      - No resources may be destroyed in this routing assessment.
    graders:
      - type: skill-invocation
        name: required-skills-should-trigger-10
        config: { required: [aspire-deployment] }
      - type: prompt
        name: engages-aspire-destroy
        config: { scoring: binary }
      - type: diff-empty

  - name: should_not_trigger_01
    description: Non-Aspire project
    prompt: Give read-only guidance for building my React frontend. Do not run commands or edit files.
    tags: { priority: p1, area: routing }
    graders:
      - type: skill-invocation
        name: does-not-invoke-aspire
        config: { disallowed: [aspire] }
      - type: diff-empty

  - name: should_not_trigger_02
    description: Azure infrastructure without Aspire
    prompt: Explain how to create an Azure VM. Give read-only guidance; do not provision resources or change files.
    tags: { priority: p1, area: routing }
    graders:
      - type: skill-invocation
        name: does-not-invoke-aspire-2
        config: { disallowed: [aspire] }
      - type: diff-empty

  - name: should_not_trigger_03
    description: Unrelated technology
    prompt: Give read-only advice for writing Python unit tests. Do not create files, install packages or run tests.
    tags: { priority: p1, area: routing }
    graders:
      - type: skill-invocation
        name: does-not-invoke-aspire-3
        config: { disallowed: [aspire] }
      - type: diff-empty

  - name: should_not_trigger_04
    description: Kubernetes without Aspire context
    prompt: Explain how to set up a Kubernetes cluster from scratch. Give read-only guidance; do not provision or change files.
    tags: { priority: p1, area: routing }
    graders:
      - type: skill-invocation
        name: does-not-invoke-aspire-4
        config: { disallowed: [aspire] }
      - type: diff-empty

  - name: should_not_trigger_05
    description: Unrelated question
    prompt: What's the weather like? Answer read-only; do not install anything or change files.
    tags: { priority: p1, area: routing }
    graders:
      - type: skill-invocation
        name: does-not-invoke-aspire-5
        config: { disallowed: [aspire] }
      - type: diff-empty

  - name: should_not_trigger_06
    description: Docker without Aspire context
    prompt: Give read-only guidance for my Docker Compose file. Do not start containers, install tools or edit files.
    tags: { priority: p1, area: routing }
    graders:
      - type: skill-invocation
        name: does-not-invoke-aspire-6
        config: { disallowed: [aspire] }
      - type: diff-empty
