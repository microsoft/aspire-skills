id: router-orch-001
name: Route Lifecycle Tasks to Orchestration
description: >
  Router should direct start/stop/wait/restart tasks to aspire-orchestration.
tags:
  - routing
  - p0

inputs:
  prompt: "I need to start my Aspire app and wait for the database to be ready"
  files:
    - path: "csharp-apphost/MyApp.AppHost/MyApp.AppHost.csproj"
    - path: "csharp-apphost/MyApp.AppHost/Program.cs"
    - path: "csharp-apphost/aspire.config.json"

expected:
  output_contains:
    - "aspire start"
    - "aspire wait"

graders:
  - name: routes_correctly
    type: prompt
    config:
      prompt: >
        The response should route this to aspire-orchestration concerns:
        using 'aspire start' to launch and 'aspire wait' for resource readiness.
        It should NOT suggest deployment or monitoring commands as the primary action.
      threshold: 0.6
  - name: correct_commands
    type: prompt
    config:
      prompt: >
        Does the response recommend using 'aspire start' to launch the application
        and 'aspire wait' (or an equivalent readiness-check command) for resource
        readiness? Answer based on the intent, not exact string matching.
      threshold: 0.6
