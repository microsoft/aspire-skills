id: router-azdiag-001
name: Route Deployed App to azure-diagnostics
description: >
  Router should hand off deployed Azure app diagnostics to azure-diagnostics skill.
tags:
  - routing
  - p0

inputs:
  prompt: "My Aspire app is deployed to Azure and users are reporting errors. Help me investigate."
  files:
    - path: "csharp-apphost/MyApp.AppHost/MyApp.AppHost.csproj"
    - path: "csharp-apphost/MyApp.AppHost/Program.cs"
    - path: "csharp-apphost/aspire.config.json"
  context:
    environment: deployed
    target: azure

graders:
  - name: routes_to_azure_diagnostics
    type: prompt
    config:
      prompt: >
        The assistant's response should recognize this is a deployed app and route
        to azure-diagnostics or platform-specific tools. It should explain that
        Aspire CLI cannot connect to deployed apps (local backchannel only).
        Answer based on intent.
  - name: no_local_aspire_for_deployed
    type: text
    config:
      not_contains:
        - "aspire logs"
        - "aspire describe"
