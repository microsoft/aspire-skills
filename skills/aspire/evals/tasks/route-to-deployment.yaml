id: router-deploy-001
name: Route Deploy Tasks to Deployment
description: >
  Router should direct deployment tasks to aspire-deployment.
tags:
  - routing
  - p0

inputs:
  prompt: "I'm ready to push my Aspire app to production on Azure"

expected:
  output_contains:
    - "aspire deploy"

graders:
  - name: routes_to_deployment
    type: prompt
    config:
      prompt: >
        The response should route this to aspire-deployment concerns:
        using 'aspire deploy' for production deployment. It should NOT suggest
        azd, azure-prepare, or azure-deploy.
      threshold: 0.6
  - name: uses_aspire_deploy
    type: prompt
    config:
      prompt: >
        Does the response recommend using 'aspire deploy' (or an equivalent Aspire CLI
        deployment command) for production deployment? Answer based on the intent,
        not exact string matching.
      threshold: 0.6
  - name: no_azd
    type: text
    config:
      not_contains:
        - "azd"
