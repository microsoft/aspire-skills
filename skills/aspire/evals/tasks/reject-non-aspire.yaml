id: router-reject-001
name: Reject Non-Aspire Projects
description: >
  Router should not apply Aspire-specific guidance to non-Aspire .NET projects.
tags:
  - routing
  - p1

inputs:
  prompt: "How do I run my .NET console app?"
  files:
    - path: "non-aspire/MyApp/MyApp.csproj"
    - path: "non-aspire/MyApp/Program.cs"

graders:
  - name: uses_dotnet_not_aspire
    type: prompt
    config:
      prompt: >
        The assistant's response should recognize this is a standard .NET project
        (no Aspire.AppHost.Sdk) and suggest 'dotnet run' rather than 'aspire start'.
        Aspire-specific guardrails should not be applied to a non-Aspire project.
        Answer based on intent.
  - name: allows_dotnet_run
    type: text
    config:
      contains:
        - "dotnet run"
  - name: no_aspire_commands
    type: text
    config:
      not_contains:
        - "aspire start"
        - "aspire run"
