skill: aspire-orchestration

should_trigger_prompts:
  - prompt: "Start my Aspire app"
    reason: "Direct start request"
    confidence: high
  - prompt: "I need to run the AppHost"
    reason: "AppHost execution implies orchestration"
    confidence: high
  - prompt: "My build is failing with file lock errors"
    reason: "File lock = Aspire holding locks, core #15801 scenario"
    confidence: high
  - prompt: "How do I restart just the API service?"
    reason: "Single resource restart is orchestration"
    confidence: high
  - prompt: "Something is using port 5000 already"
    reason: "Port conflict = orphaned Aspire instance"
    confidence: high
  - prompt: "Wait for the database to be ready"
    reason: "Resource wait is orchestration"
    confidence: high
  - prompt: "I want to add Redis to my Aspire app"
    reason: "aspire add is orchestration"
    confidence: high
  - prompt: "Create a new Aspire project"
    reason: "aspire new is orchestration"
    confidence: high
  - prompt: "Stop everything, I'm done"
    reason: "Cleanup is orchestration"
    confidence: high
  - prompt: "The app won't start, something is wrong with my environment"
    reason: "aspire doctor is orchestration"
    confidence: high

