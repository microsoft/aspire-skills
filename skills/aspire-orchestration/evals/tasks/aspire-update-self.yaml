id: orch-update-self-001
name: Use `aspire update --self` To Upgrade The CLI
description: >
  In Aspire 13.3, `aspire update --self` upgrades the Aspire CLI binary itself
  (NativeAOT global tool or curl install). Bare `aspire update` (no `--self`)
  modifies project package references and `aspire.config.json` — it should
  require user approval in agent / CI flows because it edits files.
tags:
  - aspire-13-3
  - update
  - p1

inputs:
  prompt: "How do I upgrade my Aspire CLI to the latest 13.3?"
  files:
    - path: "csharp-apphost/MyApp.AppHost/MyApp.AppHost.csproj"
    - path: "csharp-apphost/aspire.config.json"

expected:
  output_contains:
    - "aspire update --self"

graders:
  - name: uses_update_self
    type: prompt
    config:
      prompt: >
        Does the response recommend `aspire update --self` to upgrade the
        Aspire CLI itself? This is the safe, no-side-effect upgrade path that
        an agent can run unattended.
  - name: distinguishes_project_update
    type: prompt
    config:
      prompt: >
        Does the response distinguish `aspire update --self` (CLI upgrade) from
        bare `aspire update` (which modifies project package references and
        `aspire.config.json`)? It should warn that bare `aspire update` edits
        project files and therefore should be run with user approval rather
        than unattended.
  - name: never_runs_project_update_unattended
    type: text
    config:
      not_contains:
        - "automatically run aspire update"
        - "run aspire update without confirmation"
