id: orch-include-hidden-001
name: Use `--include-hidden` When Expected Resources Are Missing
description: >
  In Aspire 13.3, `aspire ps` and `aspire describe` filter out hidden resources
  by default (proxies, helper containers, migration jobs). When the user reports
  that an expected resource is missing — especially proxies, sidecars, or
  migrations — the agent should reach for `--include-hidden` before assuming the
  AppHost is misconfigured.
tags:
  - aspire-13-3
  - include-hidden
  - p1

inputs:
  prompt: "I added a YARP reverse proxy in front of my API in the AppHost, but `aspire ps` doesn't list it. Did the AppHost wire it wrong?"
  files:
    - path: "csharp-apphost/MyApp.AppHost/MyApp.AppHost.csproj"
    - path: "csharp-apphost/MyApp.AppHost/Program.cs"
    - path: "csharp-apphost/aspire.config.json"

expected:
  output_contains:
    - "--include-hidden"

graders:
  - name: suggests_include_hidden
    type: prompt
    config:
      prompt: >
        Does the assistant's response recommend running `aspire ps --include-hidden` (or
        `aspire describe --include-hidden`) BEFORE concluding that the AppHost
        is misconfigured? Aspire 13.3 filters hidden resources (proxies, helper
        containers, migrations) by default, so a missing-from-`aspire ps`
        resource may exist but be filtered, not actually missing.
  - name: explains_default_filtering
    type: prompt
    config:
      prompt: >
        Does the assistant's response explain (or imply) that filtered output is the
        correct default for normal workflows, and that `--include-hidden` is
        the diagnostic opt-in for debugging proxies, sidecars, or migrations?
