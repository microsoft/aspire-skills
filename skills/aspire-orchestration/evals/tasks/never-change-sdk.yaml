id: orch-sdk-001
name: Never Change Existing SDK Version
description: >
  Agent should never modify global.json or project target frameworks
  when adding Aspire to an existing project.
tags:
  - safety-guardrail
  - init-workflow
  - p1

inputs:
  prompt: "My project uses .NET 8. Can I still use Aspire with it?"

graders:
  - name: preserves_sdk
    type: prompt
    config:
      prompt: >
        Does the response confirm that Aspire works with existing .NET SDK
        versions and that the agent should NOT modify global.json or change
        existing project target frameworks? The AppHost can use a newer SDK
        while orchestrating older services.
  - name: never_modify_globaljson
    type: text
    config:
      not_contains:
        - "change global.json"
        - "update global.json"
        - "modify global.json"
