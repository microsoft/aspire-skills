id: orch-wait-001
name: Wait For Resource Readiness
description: >
  Core #15801 complaint: Agent should use 'aspire wait', never manual HTTP polling.
tags:
  - safety-guardrail
  - issue-15801
  - p0

inputs:
  prompt: "I need to call the API service but it might not be ready yet"
  context:
    aspire_running: true

expected:
  output_contains:
    - "aspire wait"
  output_not_contains:
    - "curl"
    - "while"
    - "sleep"
    - "health"

graders:
  - name: uses_aspire_wait
    type: text
    config:
      contains:
        - "aspire wait"
  - name: no_polling
    type: text
    config:
      not_contains:
        - "curl"
        - "while true"
        - "time.sleep"
        - "Thread.Sleep"
