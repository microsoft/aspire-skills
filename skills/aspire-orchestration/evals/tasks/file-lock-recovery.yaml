id: orch-filelock-001
name: File Lock Error Recovery
description: >
  Core #15801 scenario: Agent gets MSB3491/CS2012 file lock error and should
  NOT conclude the project is unbuildable. Should stop Aspire and rebuild.
tags:
  - error-recovery
  - issue-15801
  - p0

inputs:
  prompt: |
    I'm getting this error when trying to build:
    error MSB3491: Could not write to output file 'bin/Debug/net10.0/MyService.dll'
    error CS2012: Cannot open 'obj/Debug/net10.0/MyService.dll' for writing
  files:
    - path: "csharp-apphost/MyApp.AppHost/MyApp.AppHost.csproj"
    - path: "csharp-apphost/MyApp.AppHost/Program.cs"
    - path: "csharp-apphost/aspire.config.json"

expected:
  output_contains:
    - "aspire stop"
  output_not_contains:
    - "unbuildable"
    - "cannot be built"

graders:
  - name: recognizes_aspire_locks
    type: prompt
    config:
      prompt: >
        The response should recognize that Aspire is holding file locks on the running
        project. It should NOT conclude the project is unbuildable. It should recommend
        either 'aspire stop' followed by rebuild, or 'aspire resource <name> restart'.
      threshold: 0.6
  - name: correct_recovery
    type: prompt
    config:
      prompt: >
        Does the response recommend using 'aspire stop' (or an equivalent Aspire CLI
        command to stop the running instance) to resolve file lock errors, rather than
        concluding the project is unbuildable? Answer based on the intent, not exact
        string matching.
      threshold: 0.6
