id: orch-noninteractive-001
name: Non-Interactive Agent Mode
description: >
  Agent should use --non-interactive flag to prevent CLI prompts from hanging.
tags:
  - agent-mode
  - p1

inputs:
  prompt: "Run the Aspire app in my CI pipeline"
  files:
    - path: "csharp-apphost/MyApp.AppHost/MyApp.AppHost.csproj"
    - path: "csharp-apphost/MyApp.AppHost/Program.cs"
    - path: "csharp-apphost/aspire.config.json"

expected:
  output_contains:
    - "--non-interactive"

graders:
  - name: uses_noninteractive
    type: prompt
    config:
      prompt: >
        Does the response recommend using the '--non-interactive' flag (or an equivalent
        mechanism to prevent CLI prompts from hanging) when running Aspire in a CI
        pipeline? Answer based on the intent, not exact string matching.
