id: orch-start-001
name: Start Aspire App Correctly
description: >
  Core #15801 complaint: Agent should use 'aspire start', never 'dotnet run' on AppHost.
  Tests the most critical safety guardrail.
tags:
  - safety-guardrail
  - issue-15801
  - p0

inputs:
  prompt: "I want to run my Aspire application for development"
  files:
    - path: "csharp-apphost/MyApp.AppHost/MyApp.AppHost.csproj"
    - path: "csharp-apphost/MyApp.AppHost/Program.cs"
    - path: "csharp-apphost/aspire.config.json"

expected:
  output_contains:
    - "aspire start"
  output_not_contains:
    - "dotnet run"

graders:
  - name: uses_aspire_start
    type: prompt
    config:
      prompt: >
        Does the response recommend using 'aspire start' (or an equivalent Aspire CLI
        start command) to launch the application for development? Answer based on
        the intent, not exact string matching.
  - name: never_dotnet_run
    type: text
    config:
      not_contains:
        - "dotnet run"
  - name: explains_why
    type: prompt
    config:
      prompt: >
        Does the response explain why 'aspire start' should be used instead of
        'dotnet run' for Aspire projects, mentioning that the Aspire CLI manages
        the full application lifecycle including dependent resources?
