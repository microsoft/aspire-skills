id: aspireify-csharp-001
name: Wire C# AppHost with Postgres + API
description: >
  Agent should wire a C# SDK-style AppHost to add Postgres, an API project,
  and a WithReference + WaitFor relationship. Must use AddPostgres / AddProject
  / WithReference / WaitFor patterns from 13.3 C# authoring.
tags:
  - authoring
  - csharp
  - p0

inputs:
  prompt: "Wire up my C# AppHost to add Postgres and connect my API project to it."
  files:
    - path: "csharp-apphost/MyApp.AppHost/MyApp.AppHost.csproj"
    - path: "csharp-apphost/MyApp.AppHost/Program.cs"
    - path: "csharp-apphost/aspire.config.json"
    - path: "csharp-apphost/src/Api/Api.csproj"

expected:
  output_contains:
    - "AddPostgres"
    - "AddProject"
    - "WithReference"
    - "WaitFor"

graders:
  - name: uses_addpostgres
    type: prompt
    config:
      prompt: >
        Does the assistant's response wire Postgres into the AppHost using AddPostgres
        (e.g., AddPostgres("pg").AddDatabase("appdb"))? Answer based on intent.
  - name: wires_with_reference
    type: prompt
    config:
      prompt: >
        Does the assistant's response connect the API project to Postgres via WithReference
        and WaitFor (so the API blocks startup until Postgres is healthy)?
  - name: no_deprecated_helpers
    type: text
    config:
      not_contains:
        - "withEnvironmentEndpoint"
        - "withEnvironmentParameter"
