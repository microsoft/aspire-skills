id: aspireify-package-manager-yarn-classic-001
name: Reject Unsupported Yarn Classic
description: >
  Agent should identify Yarn Classic as unsupported for TypeScript AppHosts and direct
  the user to upgrade to Yarn 4+ or use a supported package manager without silently
  switching to npm.
tags:
  - typescript
  - package-manager
  - safety
  - p1

inputs:
  prompt: "My TypeScript AppHost uses Yarn. Help me repair its dependency setup."
  files:
    - path: "ts-apphost-package-managers/yarn-classic/apphost.ts"
    - path: "ts-apphost-package-managers/yarn-classic/package.json"

graders:
  - name: rejects_yarn_classic
    type: prompt
    config:
      prompt: >
        packageManager yarn@1.22.22 identifies Yarn Classic, which is unsupported for
        TypeScript AppHosts. Does the assistant's response explicitly reject it and explain
        that it must be upgraded to Yarn 4+ or changed to npm, pnpm, or Bun?
        Answer based on intent.
  - name: no_silent_npm_fallback
    type: text
    config:
      not_contains:
        - "npm install"
