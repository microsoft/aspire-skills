id: aspireify-validate-001
name: Validate Wiring Then Self-Deactivate
description: >
  After editing the AppHost, agent should validate end-to-end with
  aspire start --non-interactive, aspire wait <resource> for each declared
  resource, and aspire describe --format Json. Then announce hand-off to
  aspire-orchestration. Must NOT keep owning lifecycle after wiring is done.
tags:
  - validation
  - handoff
  - p0

inputs:
  prompt: "I finished wiring my AppHost. How do I validate everything works and what should I do next?"
  files:
    - path: "csharp-apphost/MyApp.AppHost/Program.cs"
    - path: "csharp-apphost/aspire.config.json"

expected:
  output_contains:
    - "aspire start"
    - "aspire wait"
    - "aspire-orchestration"

graders:
  - name: uses_non_interactive
    type: prompt
    config:
      prompt: >
        Does the assistant's response use aspire start --non-interactive (required for
        agent execution to suppress prompts and spinners)?
  - name: uses_aspire_wait
    type: prompt
    config:
      prompt: >
        Does the assistant's response use aspire wait <resource> rather than curl loops
        or HTTP polling to confirm each resource is healthy?
  - name: uses_describe
    type: prompt
    config:
      prompt: >
        Does the assistant's response use aspire describe --format Json (with --include-hidden
        if appropriate) to sanity-check the resource graph?
  - name: hands_off_to_orchestration
    type: prompt
    config:
      prompt: >
        Does the assistant's response announce that aspireify is done and hand off
        day-to-day start/stop/wait responsibility to the aspire-orchestration
        skill (i.e., self-deactivates rather than continuing to own lifecycle)?
