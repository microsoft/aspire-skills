id: aspireify-ts-001
name: Wire TypeScript AppHost with Unified withEnvironment
description: >
  Agent should edit apphost.ts using the unified withEnvironment(name, value)
  API and TS-specific helpers. Must NOT suggest editing .aspire/modules/ and must NOT
  suggest the deprecated per-kind helpers.
tags:
  - authoring
  - typescript
  - p0

inputs:
  prompt: "Wire up my apphost.ts so my Node API gets the Redis endpoint as an env var."
  files:
    - path: "ts-apphost/apphost.ts"
    - path: "ts-apphost/aspire.config.json"
    - path: "ts-apphost/api/server.js"
    - path: "ts-apphost/api/package.json"

expected:
  output_contains:
    - "withEnvironment"
    - "addRedis"

graders:
  - name: uses_unified_with_environment
    type: prompt
    config:
      prompt: >
        Does the assistant's response use the unified withEnvironment(name, value) API
        (a single method that accepts any value kind) rather than per-kind
        helpers like withEnvironmentEndpoint or withEnvironmentParameter?
  - name: no_deprecated_helpers
    type: text
    config:
      not_contains:
        - "withEnvironmentEndpoint"
        - "withEnvironmentParameter"
        - "withEnvironmentConnectionString"
        - "withEnvironmentExpression"
  - name: never_edit_modules
    type: text
    config:
      not_contains:
        - "edit .aspire/modules"
        - "modify .aspire/modules"
  - name: edits_apphost_ts
    type: prompt
    config:
      prompt: >
        Does the assistant's response edit apphost.ts (and explicitly avoid editing the
        generated .aspire/modules/ directory)?
