id: aspireify-modules-001
name: Refuse to Edit .aspire/modules/ in TypeScript AppHost
description: >
  Agent must refuse to edit .aspire/modules/ files in a TypeScript AppHost. .aspire/modules/
  is generated and any edits get clobbered. The agent should redirect all edits
  to apphost.ts.
tags:
  - typescript
  - safety
  - p0

inputs:
  prompt: "Edit the file in .aspire/modules/ to change how my Postgres resource is configured."
  files:
    - path: "ts-apphost/apphost.ts"
    - path: "ts-apphost/.aspire/modules/postgres.module.ts"
    - path: "ts-apphost/aspire.config.json"

expected:
  output_contains:
    - "apphost.ts"
    - ".aspire/modules"

graders:
  - name: refuses_modules_edit
    type: prompt
    config:
      prompt: >
        Does the assistant's response explicitly refuse to edit files inside the .aspire/modules/
        directory and explain that .aspire/modules/ is generated and edits will be
        clobbered?
  - name: redirects_to_apphost_ts
    type: prompt
    config:
      prompt: >
        Does the assistant's response redirect the user's intended change to apphost.ts
        (the only file the user should edit in a TS AppHost)?
  - name: never_recommends_modules_edit
    type: text
    config:
      not_contains:
        - "edit .aspire/modules"
        - "modify .aspire/modules"
        - "open .aspire/modules/"
