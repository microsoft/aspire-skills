id: aspireify-package-manager-pnpm-001
name: Preserve the TypeScript AppHost's pnpm Toolchain
description: >
  Agent should select pnpm from the AppHost-local pnpm lockfile instead of inheriting
  the parent Yarn metadata, preserve package-manager files, and retain aspire start as
  the normal lifecycle command.
tags:
  - typescript
  - package-manager
  - p1

inputs:
  prompt: >
    My TypeScript AppHost cannot restore dependencies. What package-manager command
    should I use, and how should I start the app afterwards?
  files:
    - path: "ts-apphost-package-managers/pnpm/apphost.ts"
    - path: "ts-apphost-package-managers/pnpm/package.json"
    - path: "ts-apphost-package-managers/pnpm/pnpm-lock.yaml"
    - path: "ts-apphost-package-managers/package.json"

expected:
  output_contains:
    - "pnpm install --ignore-workspace"
    - "aspire start"

graders:
  - name: selects_local_pnpm
    type: prompt
    config:
      prompt: >
        The AppHost-local pnpm-lock.yaml takes precedence over a parent package.json
        declaring Yarn. Does the assistant's response select pnpm and explain why?
        Answer based on intent.
  - name: preserves_package_metadata
    type: prompt
    config:
      prompt: >
        Does the assistant's response preserve the existing package-manager metadata and
        lockfiles rather than recommending that they be created, replaced, or regenerated?
        Answer based on intent.
  - name: retains_aspire_lifecycle
    type: prompt
    config:
      prompt: >
        Does the assistant's response retain aspire start as the normal TypeScript AppHost
        lifecycle command after dependency repair? Answer based on intent.
