id: aspireify-filebased-001
name: Wire File-Based C# AppHost (apphost.cs)
description: >
  Agent should edit a file-based C# AppHost (apphost.cs with #:sdk and #:package
  directives) — not invent a .csproj. Must use AddProject(name, path) overload
  since strongly-typed Projects.X is not available in file-based mode.
tags:
  - authoring
  - file-based-csharp
  - p1

inputs:
  prompt: "I have an apphost.cs file. Add Redis and wire up my API project to use it."
  files:
    - path: "file-based/apphost.cs"
    - path: "file-based/aspire.config.json"
    - path: "file-based/src/Api/Api.csproj"

expected:
  output_contains:
    - "#:sdk"
    - "#:package"
    - "AddRedis"
    - "AddProject"

graders:
  - name: edits_apphost_cs
    type: prompt
    config:
      prompt: >
        Does the response edit apphost.cs directly (with #:sdk and #:package
        directives at the top), rather than creating a .csproj file?
  - name: uses_path_overload
    type: prompt
    config:
      prompt: >
        Does the response use AddProject("name", "path/to/Api.csproj") — the
        path overload — instead of AddProject<Projects.Api>("name") which is
        only available in SDK-style AppHosts with strongly-typed references?
  - name: adds_redis_package
    type: prompt
    config:
      prompt: >
        Does the response add a #:package directive for Aspire.Hosting.Redis
        so AddRedis is available?
