id: aspireify-nextjs-001
name: Wire Next.js Frontend with AddNextJsApp
description: >
  Agent should use the 13.3 first-class AddNextJsApp helper (auto standalone
  publish) for a Next.js frontend, not roll a custom Dockerfile or use AddNodeApp.
tags:
  - authoring
  - javascript
  - 13-3
  - p1

inputs:
  prompt: "Add my Next.js frontend in ./web to my Aspire AppHost and wire it to talk to my API."
  files:
    - path: "csharp-apphost/MyApp.AppHost/Program.cs"
    - path: "csharp-apphost/MyApp.AppHost/MyApp.AppHost.csproj"
    - path: "web/package.json"
    - path: "web/next.config.js"

expected:
  output_contains:
    - "AddNextJsApp"
    - "WithReference"

graders:
  - name: uses_add_next_js_app
    type: prompt
    config:
      prompt: >
        Does the assistant's response use AddNextJsApp("web", "./web") (the 13.3 first-class
        Next.js helper that auto-applies standalone publishing) rather than
        AddNodeApp or a hand-rolled Dockerfile?
  - name: mentions_standalone_output
    type: prompt
    config:
      prompt: >
        Does the assistant's response mention setting output:"standalone" in next.config.js
        so that AddNextJsApp's auto-publish works correctly?
  - name: wires_to_api
    type: prompt
    config:
      prompt: >
        Does the assistant's response connect the Next.js app to the API via WithReference
        (or equivalent) so the frontend gets the API endpoint via service discovery?
  - name: no_dockerfile_recommendation
    type: text
    config:
      not_contains:
        - "write a Dockerfile"
        - "create a Dockerfile"
        - "hand-rolled Dockerfile"
