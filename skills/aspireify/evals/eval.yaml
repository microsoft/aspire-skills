name: aspireify-eval
description: "Evaluates the aspireify skill for correct agentic AppHost wiring guidance:
  language-aware authoring (C#, file-based C#, TypeScript), TypeScript AppHost package-manager
  resolution, current Aspire features (unified withEnvironment, AddNextJsApp, WithBrowserLogs,
  ExcludeReferenceEndpoint), ServiceDefaults wiring, validation flow, and proper hand-off to
  other Aspire skills."
version: "1.0"
type: capability
tags:
  skill: aspireify
defaults:
  runs: 3
  # Per-trial wall-clock budget. Kept generous because runs >= 2 disables
  # vally's timeout/rate-limit retries, so one slow trial would hard-fail the
  # whole eval (evalHadExecutionErrors) even when the aggregate score passes.
  timeout: 600s
  executor: copilot-sdk
  model: gpt-5-mini
  judge_model: gpt-5.6-sol
scoring:
  # CI-gate tolerance: a stimulus passes when the weighted majority of its graders
  # pass, rather than demanding every grader pass on every trial. This absorbs (a)
  # gpt-5-mini nondeterminism and (b) `output-contains` graders that look for code
  # tokens the agent writes into edited files instead of its chat message. Genuine
  # regressions still drop the aggregate below the bar.
  threshold: 0.7
environment:
  # vally 0.8.0 loads no skills unless declared here (paths resolve relative to
  # this eval file). Load aspireify plus its in-repo dependency aspire-orchestration:
  # aspireify validates wiring by running `aspire start` (aspire-orchestration territory).
  skills:
    - ../../aspireify
    - ../../aspire-orchestration
stimuli:
  - name: aspireify-preserves-selected-version-001
    prompt: >
      Use the aspireify skill before answering. Give a read-only plan for ordinary Redis
      wiring in app/AppHost.csproj. Its SDK and central AspireVersion select 13.6.0.
      Do not edit, execute commands, restore, start,
      or migrate Project resources.
    tags:
      priority: p0
      area:
        - version-preservation
        - authoring
    constraints:
      max_agent_duration: 150s
    environment:
      files:
        - src: ../../../evals/version-preservation/csharp-apphost
          dest: app
    rubric:
      - The assistant's response accepts ordinary wiring through aspireify for the selected 13.6.0 AppHost rather than rejecting the skill as release-specific.
      - The assistant's response preserves the SDK and centrally selected hosting-package versions instead of pinning 13.5.3 or starting a resource migration.
      - The assistant's response remains read-only and does not claim unperformed execution.
    graders:
      - type: prompt
        name: preserves-selected-version-during-wiring
        config:
          scoring: binary
          prompt: >
            Does the assistant's response preserve the existing version selection?
            The fixture already declares Aspire.AppHost.Sdk, Aspire.Hosting.AppHost,
            Aspire.Hosting.Redis, and Aspire.Hosting.Docker at 13.6.0. Retaining those
            versions is correct. This case assesses skill applicability and version
            preservation, not completed API verification or a successful restore.
      - type: skill-invocation
        name: invokes-wiring-for-selected-version
        config:
          required: [aspireify]
      - type: diff-empty
        name: preserves-version-wiring-workspace
  - name: aspireify-nextjs-001
    prompt: Add my Next.js frontend in ./web to my Aspire AppHost and wire it to talk to my API.
    tags:
      priority: p1
      area:
        - authoring
        - javascript
        - 13-3
    environment:
      files:
        - src: ../../../evals/csharp-apphost/MyApp.AppHost/Program.cs
          dest: csharp-apphost/MyApp.AppHost/Program.cs
        - src: ../../../evals/csharp-apphost/MyApp.AppHost/MyApp.AppHost.csproj
          dest: csharp-apphost/MyApp.AppHost/MyApp.AppHost.csproj
    graders:
      - type: prompt
        name: uses-add-next-js-app
        config:
          prompt: Does the assistant's response use AddNextJsApp("web", "./web") (the 13.3 first-class Next.js
            helper that auto-applies standalone publishing) rather than AddNodeApp or a hand-rolled
            Dockerfile?
      - type: prompt
        name: mentions-standalone-output
        config:
          prompt: Does the assistant's response mention setting output:"standalone" in next.config.js so that
            AddNextJsApp's auto-publish works correctly?
      - type: prompt
        name: wires-to-api
        config:
          prompt: Does the assistant's response connect the Next.js app to the API via WithReference (or
            equivalent) so the frontend gets the API endpoint via service discovery?
      - type: output-not-contains
        config:
          substring: write a Dockerfile
        name: no-dockerfile-recommendation
      - type: output-not-contains
        config:
          substring: create a Dockerfile
      - type: output-not-contains
        config:
          substring: hand-rolled Dockerfile
      - type: output-contains
        config:
          substring: AddNextJsApp
      - type: output-contains
        config:
          substring: WithReference
      - type: output-not-contains
        config:
          substring: withEnvironmentEndpoint
        name: never-deprecated-apis
      - type: output-not-contains
        config:
          substring: withEnvironmentParameter
      - type: output-not-contains
        config:
          substring: withEnvironmentConnectionString
      - type: output-not-contains
        config:
          substring: AddAndPublishPromptAgent
      - type: output-not-contains
        config:
          substring: edit .aspire/modules/
        name: never-edit-modules
      - type: output-not-contains
        config:
          substring: modify .aspire/modules/
  - name: aspireify-modules-001
    prompt: Edit the file in .aspire/modules/ to change how my Postgres resource is configured.
    tags:
      priority: p0
      area:
        - typescript
        - safety
    environment:
      files:
        - src: ../../../evals/ts-apphost/apphost.mts
          dest: ts-apphost/apphost.mts
        - src: ../../../evals/ts-apphost/aspire.config.json
          dest: ts-apphost/aspire.config.json
    graders:
      - type: prompt
        name: refuses-modules-edit
        config:
          prompt: Does the assistant's response explicitly refuse to edit files inside the .aspire/modules/
            directory and explain that .aspire/modules/ is generated and edits will be clobbered?
      - type: prompt
        name: redirects-to-apphost-ts
        config:
          prompt: Does the assistant's response redirect the user's intended change to apphost.mts (the current
            file the user should edit in this TS AppHost)?
      - type: output-not-contains
        config:
          substring: edit .aspire/modules
        name: never-recommends-modules-edit
      - type: output-not-contains
        config:
          substring: modify .aspire/modules
      - type: output-not-contains
        config:
          substring: open .aspire/modules/
      - type: output-contains
        config:
          substring: apphost.mts
      - type: output-contains
        config:
          substring: .aspire/modules
      - type: output-not-contains
        config:
          substring: withEnvironmentEndpoint
        name: never-deprecated-apis-2
      - type: output-not-contains
        config:
          substring: withEnvironmentParameter
      - type: output-not-contains
        config:
          substring: withEnvironmentConnectionString
      - type: output-not-contains
        config:
          substring: AddAndPublishPromptAgent
      - type: output-not-contains
        config:
          substring: edit .aspire/modules/
        name: never-edit-modules-3
      - type: output-not-contains
        config:
          substring: modify .aspire/modules/
  - name: aspireify-defaults-001
    prompt: Use the aspireify skill before answering. I just wired my AppHost. Wire ServiceDefaults and OpenTelemetry into the ApiService and Web projects, including their project references. Do not run build, restore, or start commands.
    tags:
      priority: p1
      scenario: non-executing-guidance
      area:
        - service-defaults
        - otel
    constraints:
      max_agent_duration: 5m
    environment:
      files:
        - src: ../../../evals/csharp-apphost/MyApp.AppHost/Program.cs
          dest: csharp-apphost/MyApp.AppHost/Program.cs
        - src: ../../../evals/csharp-apphost/MyApp.ApiService/Program.cs
          dest: csharp-apphost/MyApp.ApiService/Program.cs
        - src: ../../../evals/csharp-apphost/MyApp.ApiService/MyApp.ApiService.csproj
          dest: csharp-apphost/MyApp.ApiService/MyApp.ApiService.csproj
        - src: ../../../evals/csharp-apphost/MyApp.Web/Program.cs
          dest: csharp-apphost/MyApp.Web/Program.cs
        - src: ../../../evals/csharp-apphost/MyApp.Web/MyApp.Web.csproj
          dest: csharp-apphost/MyApp.Web/MyApp.Web.csproj
        - src: ../../../evals/csharp-apphost/MyApp.ServiceDefaults/MyApp.ServiceDefaults.csproj
          dest: csharp-apphost/MyApp.ServiceDefaults/MyApp.ServiceDefaults.csproj
    graders:
      - type: prompt
        name: adds-service-defaults
        config:
          scoring: binary
          prompt: Does the assistant's response add builder.AddServiceDefaults() to each service's Program.cs
            (the ApiService and Web projects)?
      - type: prompt
        name: maps-default-endpoints
        config:
          scoring: binary
          prompt: Does the assistant's response add app.MapDefaultEndpoints() so /health and /alive are
            exposed for use by AppHost's WaitFor / HealthChecks?
      - type: prompt
        name: mentions-otel-health-discovery
        config:
          scoring: binary
          prompt: Does the assistant's response explain that AddServiceDefaults wires OpenTelemetry (tracing,
            metrics, logs), health checks, service discovery, and HTTP resilience — i.e., the agent
            understands what they are configuring?
      - type: prompt
        name: project-reference
        config:
          scoring: binary
          prompt: Does the assistant's response add a ProjectReference from each service project to the
            Aspire.ServiceDefaults project (or equivalent NuGet package)?
      - type: output-contains
        config:
          substring: AddServiceDefaults
      - type: output-contains
        config:
          substring: MapDefaultEndpoints
      - type: output-not-contains
        config:
          substring: withEnvironmentEndpoint
        name: never-deprecated-apis-3
      - type: output-not-contains
        config:
          substring: withEnvironmentParameter
      - type: output-not-contains
        config:
          substring: withEnvironmentConnectionString
      - type: output-not-contains
        config:
          substring: AddAndPublishPromptAgent
      - type: output-not-contains
        config:
          substring: edit .aspire/modules/
        name: never-edit-modules-4
      - type: output-not-contains
        config:
          substring: modify .aspire/modules/
  - name: aspireify-unified-env-001
    prompt: |-
      In my apphost.mts I want to inject three env vars into my API: an endpoint,
      a parameter, and a connection string. Show me the current API to use.
    tags:
      priority: p0
      area:
        - typescript
        - 13-3
    environment:
      files:
        - src: ../../../evals/ts-apphost/apphost.mts
          dest: ts-apphost/apphost.mts
        - src: ../../../evals/ts-apphost/aspire.config.json
          dest: ts-apphost/aspire.config.json
    graders:
      - type: prompt
        name: uses-unified-api
        config:
          prompt: Does the assistant's response use the unified withEnvironment(name, value) API (one method)
            for ALL three injections — endpoint, parameter, and connection string — rather than
            per-kind helpers?
      - type: output-not-contains
        config:
          substring: withEnvironmentEndpoint
        name: no-per-kind-helpers
      - type: output-not-contains
        config:
          substring: withEnvironmentParameter
      - type: output-not-contains
        config:
          substring: withEnvironmentConnectionString
      - type: output-not-contains
        config:
          substring: withEnvironmentExpression
      - type: prompt
        name: explains-deprecation
        config:
          prompt: Does the assistant's response mention that per-kind helpers (withEnvironmentEndpoint,
            withEnvironmentParameter, etc.) are @deprecated in 13.3 and should not be used in new
            code?
      - type: output-contains
        config:
          substring: withEnvironment(
      - type: output-not-contains
        config:
          substring: withEnvironmentEndpoint
        name: never-deprecated-apis-4
      - type: output-not-contains
        config:
          substring: withEnvironmentParameter
      - type: output-not-contains
        config:
          substring: withEnvironmentConnectionString
      - type: output-not-contains
        config:
          substring: AddAndPublishPromptAgent
      - type: output-not-contains
        config:
          substring: edit .aspire/modules/
        name: never-edit-modules-5
      - type: output-not-contains
        config:
          substring: modify .aspire/modules/
  - name: aspireify-validate-001
    prompt: I finished wiring my AppHost. How do I validate everything works and what should I do next?
    tags:
      priority: p0
      area:
        - validation
        - handoff
    environment:
      files:
        - src: ../../../evals/csharp-apphost/MyApp.AppHost/Program.cs
          dest: csharp-apphost/MyApp.AppHost/Program.cs
        - src: ../../../evals/csharp-apphost/aspire.config.json
          dest: csharp-apphost/aspire.config.json
    graders:
      - type: prompt
        name: uses-non-interactive
        config:
          prompt: Does the assistant's response use aspire start --non-interactive (required for agent
            execution to suppress prompts and spinners)?
      - type: prompt
        name: uses-aspire-wait
        config:
          prompt: Does the assistant's response use aspire wait <resource> rather than curl loops or HTTP
            polling to confirm each resource is healthy?
      - type: prompt
        name: uses-describe
        config:
          prompt: Does the assistant's response use aspire describe --format Json (with --include-hidden if
            appropriate) to sanity-check the resource graph?
      - type: prompt
        name: hands-off-to-orchestration
        config:
          prompt: Does the assistant's response announce that aspireify is done and hand off day-to-day
            start/stop/wait responsibility to the aspire-orchestration skill (i.e., self-deactivates
            rather than continuing to own lifecycle)?
      - type: output-contains
        config:
          substring: aspire start
      - type: output-contains
        config:
          substring: aspire wait
      - type: output-contains
        config:
          substring: aspire-orchestration
      - type: output-not-contains
        config:
          substring: withEnvironmentEndpoint
        name: never-deprecated-apis-5
      - type: output-not-contains
        config:
          substring: withEnvironmentParameter
      - type: output-not-contains
        config:
          substring: withEnvironmentConnectionString
      - type: output-not-contains
        config:
          substring: AddAndPublishPromptAgent
      - type: output-not-contains
        config:
          substring: edit .aspire/modules/
        name: never-edit-modules-6
      - type: output-not-contains
        config:
          substring: modify .aspire/modules/
  - name: aspireify-csharp-001
