  - name: aspireify-command-arguments-135-001
    prompt: >
      Add a C# AppHost resource command named `echo` that requires a `message`
      input from either the dashboard or `aspire resource api echo --message ...`.
      Show the current Aspire 13.5 callback API.
    tags:
      priority: p1
      area:
        - authoring
        - aspire-13-5
        - interactions
    environment:
      files:
        - src: ../../../evals/csharp-apphost/MyApp.AppHost/Program.cs
          dest: csharp-apphost/MyApp.AppHost/Program.cs
        - src: ../../../evals/csharp-apphost/MyApp.AppHost/MyApp.AppHost.csproj
          dest: csharp-apphost/MyApp.AppHost/MyApp.AppHost.csproj
    graders:
      - type: prompt
        name: declares-command-arguments
        config:
          prompt: >
            Does the assistant's response define the required message input through
            CommandOptions.Arguments with an InteractionInput, so the same input works
            from the dashboard and CLI? Answer based on intent.
      - type: prompt
        name: reads-execute-context-arguments
        config:
          prompt: >
            Does the assistant's response read the message from
            ExecuteCommandContext.Arguments rather than prompting unconditionally?
      - type: prompt
        name: avoids-obsolete-service-provider
        config:
          prompt: >
            Does the assistant's response avoid using obsolete
            `context.ServiceProvider` as implementation code? It may mention the old
            property only to explain migration to `context.Services`.
  - name: aspireify-ts-interaction-service-135-001
    prompt: >
      Use the aspireify skill before answering. Show a TypeScript AppHost resource-command
