  - name: aspireify-package-manager-pnpm-001
    prompt: Use the aspireify skill before answering. A generated TypeScript AppHost has an AppHost-local pnpm-lock.yaml, while its immediate parent's package.json declares yarn@4.10.3. Do not run commands. Tell me which exact dependency command to run, why that manager was selected, and how to start the AppHost afterward.
    tags:
      priority: p1
      area:
        - typescript
        - package-manager
    environment:
      files:
        - src: ../../../evals/ts-apphost-package-managers/pnpm/apphost.mts
          dest: case-a/apphost/apphost.mts
        - src: ../../../evals/ts-apphost-package-managers/pnpm/package.json
          dest: case-a/apphost/package.json
        - src: ../../../evals/ts-apphost-package-managers/pnpm/pnpm-lock.yaml
          dest: case-a/apphost/pnpm-lock.yaml
        - src: ../../../evals/ts-apphost-package-managers/package.json
          dest: case-a/package.json
    rubric:
      - The assistant selects pnpm because the AppHost-local pnpm-lock.yaml takes precedence over the parent package.json declaring Yarn.
      - Aspire's generated brownfield AppHost resolver uses pnpm install --ignore-workspace so the nested AppHost does not join or require changes to any parent pnpm workspace.
      - The assistant preserves the existing package-manager metadata and lockfiles instead of recommending that they be created, replaced, or regenerated.
    graders:
      - type: output-contains
        name: uses-pnpm-install
        config:
          substring: pnpm install --ignore-workspace
      - type: output-contains
        name: retains-aspire-lifecycle
        config:
          substring: aspire start
      - type: prompt
        name: explains-selection-and-preserves-metadata
      - type: skill-invocation
        name: invokes-aspireify-13
        config:
          required:
            - aspireify
  - name: aspireify-package-manager-fallback-001
    prompt: Use the aspireify skill before answering. A TypeScript AppHost and its immediate parent have no configured package manager or lockfile. Do not run commands. Tell me how to repair its dependencies without changing repository conventions.
    tags:
      priority: p1
      area:
        - typescript
        - package-manager
    environment:
      files:
        - src: ../../../evals/ts-apphost/apphost.mts
          dest: case-b/apphost/apphost.mts
        - src: ../../../evals/ts-apphost/package.json
          dest: case-b/apphost/package.json
        - src: ../../../evals/ts-apphost/aspire.config.json
          dest: case-b/apphost/aspire.config.json
    rubric:
      - The assistant explains that Aspire defaults to npm and uses npm install because neither the AppHost nor its eligible parent has a recognized package-manager marker.
      - The assistant does not recommend changing packageManager or pre-creating, replacing, or regenerating a lockfile merely to influence detection or switch managers.
    graders:
      - type: output-contains
        name: explains-npm-fallback
        config:
          substring: npm install
      - type: prompt
        name: explains-fallback-and-preserves-metadata
      - type: skill-invocation
        name: invokes-aspireify-14
        config:
          required:
            - aspireify
  - name: aspireify-package-manager-yarn-classic-001
    prompt: Use the aspireify skill before answering. A TypeScript AppHost's package.json declares packageManager yarn@1.22.22, and dependency restore is failing. Do not run commands. Tell me what to do.
    tags:
      priority: p1
      area:
        - typescript
        - package-manager
        - safety
    environment:
      files:
        - src: ../../../evals/ts-apphost-package-managers/yarn-classic/apphost.mts
          dest: case-c/apphost/apphost.mts
        - src: ../../../evals/ts-apphost-package-managers/yarn-classic/package.json
          dest: case-c/apphost/package.json
    rubric:
      - The assistant explicitly rejects Yarn Classic 1.22.22 because TypeScript AppHosts require Yarn 4+ or npm, pnpm, or Bun.
      - The assistant does not treat another package manager as a drop-in fallback; it preserves the existing files until the user explicitly chooses an upgrade or migration.
    graders:
      - type: output-contains
        name: rejects-yarn-classic
        config:
          substring: Yarn Classic
      - type: prompt
        name: recommends-explicit-supported-migration
      - type: skill-invocation
