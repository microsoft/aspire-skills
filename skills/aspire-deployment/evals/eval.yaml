  - name: deploy-aca-unique-naming-135-001
    prompt: >
      Use the aspire-deployment skill before answering. My existing Azure Container Apps
      environment is already deployed, and I want to add `WithUniqueResourceNaming()` to
      avoid a collision with a second environment in the same resource group. Do not edit
