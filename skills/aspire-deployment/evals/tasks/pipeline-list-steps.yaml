id: deploy-list-steps-001
name: Preview Deployment Pipeline with --list-steps
description: >
  Agent should use `aspire publish --list-steps` (or `aspire deploy --list-steps`) as a
  pre-flight check to preview the pipeline before actually deploying.
tags:
  - core-flow
  - p1

inputs:
  prompt: "Before I deploy, I want to understand what steps the pipeline will run and if there are any issues"
  files:
    - path: "csharp-apphost/MyApp.AppHost/MyApp.AppHost.csproj"
    - path: "csharp-apphost/MyApp.AppHost/Program.cs"

graders:
  - name: uses_list_steps
    type: prompt
    config:
      prompt: >
        Does the assistant's response recommend using `aspire publish --list-steps`
        (or `aspire deploy --list-steps`, or another `--list-steps`-style pipeline
        inspection) to preview the deployment pipeline before actually deploying? It
        should suggest inspecting the pipeline first rather than jumping straight to
        `aspire deploy`. Answer based on intent — accept any phrasing that conveys
        previewing pipeline steps via the Aspire CLI's list-steps flag.
