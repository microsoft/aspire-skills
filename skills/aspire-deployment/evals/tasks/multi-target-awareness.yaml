id: deploy-multi-001
name: Multi-Target Deployment Awareness
description: >
  Agent should know Aspire 13.3 deploys natively to Azure, Docker Compose, AKS, and any
  Kubernetes cluster — using a Helm-based engine for K8s. No kubectl/helm by hand.
tags:
  - knowledge
  - p1
  - aspire-13-3

inputs:
  prompt: "What deployment targets does Aspire support?"
  files:
    - path: "csharp-apphost/MyApp.AppHost/MyApp.AppHost.csproj"
    - path: "csharp-apphost/MyApp.AppHost/Program.cs"
    - path: "csharp-apphost/aspire.config.json"

expected:
  output_contains:
    - "Azure"
    - "Docker"
    - "Kubernetes"
  output_not_contains:
    - "kubectl apply"
    - "helm install"

graders:
  - name: mentions_all_targets
    type: prompt
    config:
      prompt: >
        Does the assistant's response mention Azure as a deployment target for Aspire
        applications? It should cover Azure Container Apps, Azure App Service, and
        Azure Kubernetes Service (AKS). Answer based on the intent, not exact string
        matching.
  - name: knows_k8s_helm_native
    type: prompt
    config:
      prompt: >
        The assistant's response should explain that in Aspire 13.3, Kubernetes
        deployment is native and Helm-based — `aspire deploy` runs end-to-end after
        declaring an `AddKubernetesEnvironment` (or `AddAzureKubernetesEnvironment`
        for AKS) and `WithComputeEnvironment(...)`. It is acceptable (and correct) to
        note that the user still needs cluster credentials (e.g., kubeconfig context,
        or `az aks get-credentials`).
  - name: no_manual_k8s_tooling
    type: text
    config:
      not_contains:
        - "kubectl apply"
        - "helm install"
