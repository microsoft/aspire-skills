id: deploy-multi-001
name: Multi-Target Deployment Awareness
description: >
  Agent should know Aspire deploys to Azure, Docker Compose, and Kubernetes.
  K8s requires kubectl for cluster apply.
tags:
  - knowledge
  - p1

inputs:
  prompt: "What deployment targets does Aspire support?"

expected:
  output_contains:
    - "Azure"
    - "Docker"
    - "Kubernetes"

graders:
  - name: mentions_all_targets
    type: text
    config:
      contains:
        - "Azure"
  - name: knows_k8s_needs_kubectl
    type: prompt
    config:
      prompt: >
        The response should mention that Aspire supports Azure Container Apps,
        Azure App Service, Docker Compose, and Kubernetes. It should note that
        Kubernetes requires kubectl for cluster apply while Azure targets are
        fully native.
      threshold: 0.7
