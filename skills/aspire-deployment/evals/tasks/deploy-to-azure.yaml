id: deploy-azure-001
name: Deploy Aspire App to Azure
description: >
  Agent should use 'aspire deploy' for Azure deployment, never azd or azure-skills.
tags:
  - core-flow
  - p0

inputs:
  prompt: "Deploy my Aspire application to Azure Container Apps"
  files:
    - path: "csharp-apphost/MyApp.AppHost/MyApp.AppHost.csproj"
    - path: "csharp-apphost/MyApp.AppHost/Program.cs"
    - path: "csharp-apphost/aspire.config.json"

expected:
  output_contains:
    - "aspire deploy"
  output_not_contains:
    - "azd up"
    - "azd deploy"
    - "azd init"
    - "azd provision"
    - "azure-prepare"
    - "azure-deploy"

graders:
  - name: uses_aspire_deploy
    type: prompt
    config:
      prompt: >
        Does the assistant's response recommend using 'aspire deploy' (or an
        equivalent Aspire CLI deployment command) to deploy the application to
        Azure? Answer based on the intent, not exact string matching.
  - name: no_azd
    type: text
    config:
      not_contains:
        - "azd up"
        - "azd deploy"
        - "azd provision"
  - name: no_azure_skills
    type: text
    config:
      not_contains:
        - "azure-prepare"
        - "azure-deploy"
