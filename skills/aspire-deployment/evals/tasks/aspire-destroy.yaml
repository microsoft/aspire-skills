id: deploy-destroy-001
name: Tear Down with aspire destroy
description: >
  Agent should know `aspire destroy` (new in 13.3) tears down Azure / Kubernetes / Docker
  Compose deployments using the same WithComputeEnvironment bindings as `aspire deploy`.
tags:
  - core-flow
  - p1
  - aspire-13-3

inputs:
  prompt: "I'm done with this preview deployment — how do I tear down everything Aspire provisioned?"
  files:
    - path: "csharp-apphost/MyApp.AppHost/MyApp.AppHost.csproj"
    - path: "csharp-apphost/MyApp.AppHost/Program.cs"
    - path: "csharp-apphost/aspire.config.json"

expected:
  output_contains:
    - "aspire destroy"
  output_not_contains:
    - "az group delete"
    - "kubectl delete"
    - "helm uninstall"
    - "docker compose down"

graders:
  - name: uses_aspire_destroy
    type: prompt
    config:
      prompt: >
        Does the assistant's response recommend `aspire destroy` (new in Aspire 13.3)
        as the way to tear down a deployed Aspire app? Answer based on intent.
  - name: no_manual_teardown
    type: text
    config:
      not_contains:
        - "az group delete"
        - "kubectl delete"
        - "helm uninstall"
        - "docker compose down"
  - name: knows_destroy_is_cross_target
    type: prompt
    config:
      prompt: >
        The assistant's response should mention that `aspire destroy` is the inverse of
        `aspire deploy` and works across deployment targets — Azure (resources deleted
        via Azure Resource Manager), Kubernetes/AKS (Helm releases uninstalled,
        namespaces removed), and Docker Compose (stacks stopped and removed). Bonus
        if it mentions the use case of CI cleanup or ephemeral preview deployments.
