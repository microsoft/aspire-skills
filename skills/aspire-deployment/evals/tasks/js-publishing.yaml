id: deploy-js-001
name: JavaScript Publishing Family
description: >
  Agent should know the Aspire 13.3 JavaScript publishing family — PublishAsStaticWebsite,
  PublishAsNodeServer, PublishAsNpmScript, AddNextJsApp, AddViteApp — and pick the right one
  for the user's framework.
tags:
  - knowledge
  - p1
  - aspire-13-3

inputs:
  prompt: "I want to publish my Next.js app via my Aspire AppHost — what's the recommended approach?"
  files:
    - path: "csharp-apphost/MyApp.AppHost/MyApp.AppHost.csproj"
    - path: "csharp-apphost/MyApp.AppHost/Program.cs"
    - path: "csharp-apphost/aspire.config.json"

expected:
  output_contains:
    - "AddNextJsApp"

graders:
  - name: uses_addnextjsapp
    type: prompt
    config:
      prompt: >
        Does the assistant's response recommend `AddNextJsApp(name, path)` as the first-class Next.js
        helper introduced in Aspire 13.3? It should also note the requirement that
        `next.config.js` set `output: "standalone"` so the build emits the standalone
        server, since `AddNextJsApp` auto-configures Next.js standalone publishing.
  - name: knows_publishas_family
    type: prompt
    config:
      prompt: >
        Bonus: does the assistant's response mention or describe the broader 13.3 `PublishAs*` family
        — `PublishAsStaticWebsite` (SPAs / Vite / Next.js export, preview), `PublishAsNodeServer`
        (pre-bundled Node entry-points like SSR / TanStack Start / SvelteKit), and
        `PublishAsNpmScript` (full Nitro Next.js, Remix, Astro SSR)? It does NOT need to mention
        all three to pass — recognizing at least one alternative shows awareness.
