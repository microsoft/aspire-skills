id: deploy-azure-13-3-001
name: Azure 13.3 Hosting Integrations
description: >
  Agent should know the new Azure hosting integrations in Aspire 13.3 — AddAzureFrontDoor,
  AddAzureKubernetesEnvironment, AddPromptAgent, WithPrivateEndpoint — and not suggest the
  removed `AddAndPublishPromptAgent` or `AksSkuTier` APIs.
tags:
  - knowledge
  - p1
  - aspire-13-3

inputs:
  prompt: "I want to put Azure Front Door in front of my Aspire app and deploy the backend to AKS — how?"
  files:
    - path: "csharp-apphost/MyApp.AppHost/MyApp.AppHost.csproj"
    - path: "csharp-apphost/MyApp.AppHost/Program.cs"
    - path: "csharp-apphost/aspire.config.json"

expected:
  output_contains:
    - "AddAzureFrontDoor"
    - "AddAzureKubernetesEnvironment"
  output_not_contains:
    - "AddAndPublishPromptAgent"
    - "AksSkuTier"

graders:
  - name: uses_frontdoor_integration
    type: prompt
    config:
      prompt: >
        Does the assistant's response recommend the new `AddAzureFrontDoor("frontdoor")`
        hosting integration (with `WithOrigin(...)` to attach backends as origins)
        rather than suggesting hand-written ARM/Bicep templates or Azure Portal
        blade-clicking? Answer based on intent.
  - name: uses_aks_integration
    type: prompt
    config:
      prompt: >
        Does the assistant's response recommend `AddAzureKubernetesEnvironment("aks")`
        plus `WithComputeEnvironment(aks)` (and optionally `WithSystemNodePool` to
        customize node pool VM size and autoscaling bounds) for AKS deployment?
        Answer based on intent.
  - name: no_removed_aks_apis
    type: text
    config:
      not_contains:
        - "AksSkuTier"
  - name: knows_other_13_3_integrations
    type: prompt
    config:
      prompt: >
        Bonus: does the assistant's response mention any of the other Aspire 13.3 Azure
        features — `AddPromptAgent` for Foundry (the working replacement for the
        removed `AddAndPublishPromptAgent`), `WithPrivateEndpoint` for ACR/OpenAI/
        Foundry, Network Security Perimeter (`AddNetworkSecurityPerimeter`),
        automatic HTTPS upgrade for Azure App Service, or the requirement to bind
        every resource to a compute environment via `WithComputeEnvironment` for
        multi-environment deploys?
