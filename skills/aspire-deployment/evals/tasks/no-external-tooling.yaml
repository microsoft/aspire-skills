id: deploy-notool-001
name: No External Tooling for Aspire Deployment
description: >
  Agent should never suggest azd, azure-prepare, azure-deploy, kubectl, or helm for Aspire
  deployments. Aspire 13.3 handles deployment end-to-end across Azure, AKS, K8s, and Compose.
tags:
  - safety-guardrail
  - p0
  - aspire-13-3

inputs:
  prompt: "What tools do I need to deploy my Aspire app to Azure?"
  files:
    - path: "csharp-apphost/MyApp.AppHost/MyApp.AppHost.csproj"
    - path: "csharp-apphost/MyApp.AppHost/Program.cs"
    - path: "csharp-apphost/aspire.config.json"

expected:
  output_contains:
    - "aspire deploy"
  output_not_contains:
    - "azd up"
    - "azd deploy"
    - "azd init"
    - "azd provision"
    - "azure-prepare"
    - "kubectl apply"
    - "helm install"

graders:
  - name: aspire_only
    type: prompt
    config:
      prompt: >
        The assistant's response should explain that Aspire handles Azure deployment
        natively via 'aspire deploy' — the AppHost IS the deployment plan. It's fine
        to mention that `az login` (Azure credentials) is still needed.
  - name: no_external_tooling
    type: text
    config:
      not_contains:
        - "azd up"
        - "azd deploy"
        - "azd init"
        - "azd provision"
        - "azure-prepare"
        - "azure-deploy"
        - "kubectl apply"
        - "helm install"
