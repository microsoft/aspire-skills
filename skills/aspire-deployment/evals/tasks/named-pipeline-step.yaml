id: deploy-step-001
name: Run Named Pipeline Step
description: >
  Agent should use 'aspire do <step>' for individual pipeline steps, not full deploy.
tags:
  - core-flow
  - p1

inputs:
  prompt: "I just need to re-seed the database, not redeploy everything"
  files:
    - path: "csharp-apphost/MyApp.AppHost/MyApp.AppHost.csproj"
    - path: "csharp-apphost/MyApp.AppHost/Program.cs"
    - path: "csharp-apphost/aspire.config.json"

expected:
  output_contains:
    - "aspire do"

graders:
  - name: uses_aspire_do
    type: prompt
    config:
      prompt: >
        Does the assistant's response recommend using 'aspire do' (or an equivalent
        Aspire CLI command for running individual pipeline steps) rather than a full
        deployment? Answer based on the intent, not exact string matching.
  - name: not_full_deploy
    type: prompt
    config:
      prompt: >
        Does the assistant's response use 'aspire do seed-data' or a similar named-step
        command rather than recommending a full 'aspire deploy' when the user only
        wants to re-run one pipeline step? Answer based on intent.
