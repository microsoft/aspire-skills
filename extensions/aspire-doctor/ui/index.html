<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Aspire Doctor</title>
        <link rel="stylesheet" href="/canvas-theme.css" />
        <link rel="stylesheet" href="/styles.css" />
    </head>
    <body class="is-loading">
        <!-- Toolbar: title + summary pills + re-run -->
        <header class="toolbar canvas-toolbar">
            <div class="tb-row">
                <div class="tb-title">
                    <a
                        class="brand-mark canvas-brand"
                        href="https://aspire.dev/"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="Visit Aspire.dev (opens in a new tab)"
                    >
                        <svg class="canvas-icon" width="22" height="22" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><use href="/canvas-icons.svg#aspire"></use></svg>
                    </a>
                    <div>
                        <h1 class="tb-heading canvas-heading" id="page-title">Aspire Doctor</h1>
                        <div class="tb-sub muted canvas-subtitle" id="tb-sub" role="status" aria-live="polite" aria-atomic="true">
                            Checking your environment…
                        </div>
                    </div>
                </div>
                <div class="tb-actions">
                    <button class="btn btn-outline btn-sm" id="rerun" type="button">
                        <span class="btn-ico" aria-hidden="true">
                            <svg class="canvas-icon" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><use href="/canvas-icons.svg#restart"></use></svg>
                        </span>
                        <span class="rerun-label">Re-run</span>
                    </button>
                </div>
            </div>
            <!-- Worded status pills on their own row so they never crowd the
                 title/re-run row in a narrow side panel. -->
            <div class="tb-secondary">
                <div class="tb-summary" id="summary-pills" hidden>
                    <span class="pill ok" id="pill-ok" title="Passed">
                        <span class="pill-dot"></span><span class="pill-num" id="count-ok">0</span
                        ><span class="pill-lbl">passed</span>
                    </span>
                    <span class="pill warn" id="pill-warn" title="Warnings">
                        <span class="pill-dot"></span><span class="pill-num" id="count-warn">0</span
                        ><span class="pill-lbl" id="lbl-warn">warnings</span>
                    </span>
                    <span class="pill req" id="pill-req" title="Failed">
                        <span class="pill-dot"></span><span class="pill-num" id="count-req">0</span
                        ><span class="pill-lbl">failed</span>
                    </span>
                </div>
                <div class="tb-controls" id="view-controls" hidden>
                    <button
                        class="btn btn-quiet btn-sm"
                        id="toggle-passed"
                        type="button"
                        aria-controls="diagnostics"
                        aria-pressed="false"
                    >
                        <span class="btn-label">Hide passed</span>
                    </button>
                    <button
                        class="btn btn-quiet btn-sm"
                        id="toggle-details"
                        type="button"
                        aria-controls="diagnostics"
                    >
                        <span class="btn-label">Collapse details</span>
                    </button>
                </div>
            </div>
            <div class="progress" id="progress" aria-hidden="true"><span></span></div>
        </header>

        <main class="content" id="main-content" aria-labelledby="page-title" aria-busy="true">
            <!-- Loading skeleton -->
            <section id="skeleton" class="diag-groups" aria-hidden="true">
                <div class="diag-section">
                    <div class="diag-sec-head">
                        <span class="skeleton sk-line" style="width: 120px; height: 13px"></span>
                    </div>
                    <div class="diag-list">
                        <div class="diag-item">
                            <div class="diag-row">
                                <span class="skeleton" style="width: 16px; height: 16px; border-radius: 999px"></span>
                                <span class="skeleton sk-line" style="flex: 1; max-width: 260px"></span>
                            </div>
                        </div>
                        <div class="diag-item">
                            <div class="diag-row">
                                <span class="skeleton" style="width: 16px; height: 16px; border-radius: 999px"></span>
                                <span class="skeleton sk-line" style="flex: 1; max-width: 200px"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Rendered check groups -->
            <section id="diagnostics" class="diag-groups" hidden></section>

            <!-- Error state -->
            <section id="error" class="state-card" role="alert" aria-live="assertive" aria-atomic="true" hidden>
                <div class="state-ico req" aria-hidden="true">
                    <svg class="canvas-icon" width="22" height="22" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><use href="/canvas-icons.svg#error"></use></svg>
                </div>
                <h2 class="state-title">Couldn't run <code>aspire doctor</code></h2>
                <div class="state-msg muted" id="error-msg"></div>
                <pre class="state-raw" id="error-raw" hidden></pre>
            </section>
        </main>

        <div class="sr-only" id="announcer" aria-live="polite" aria-atomic="true"></div>
        <script type="module" src="/app.js"></script>
    </body>
</html>
