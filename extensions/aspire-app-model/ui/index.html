<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Aspire App Model</title>
        <link rel="stylesheet" href="/styles.css" />
    </head>
    <body class="is-loading">
        <!--
        THESIS: Aspire's operational model becomes a canvas-native workspace, not a transplanted explorer tree.
        OWN-WORLD: A compact AppHost switcher, one focused work surface, and a responsive resource board with direct operational details.
        STORY: A developer chooses scope and AppHost once, then scans resources, endpoints, health, and commands without tunneling through nested disclosure.
        FIRST VIEWPORT: The selected AppHost and its highest-value actions lead directly into a flat resource board.
        FORM: The AppHost Workbench, preserving VS Code capability while replacing its stacked tree presentation.
        -->
        <header class="toolbar">
            <div class="title-row">
                <span class="brand-mark" aria-hidden="true">
                    <svg width="18" height="18" viewBox="0 0 16 16">
                        <path
                            fill="currentColor"
                            d="M8.37.086a.75.75 0 0 0-.74 0l-6.5 3.75a.75.75 0 0 0 0 1.299l6.5 3.75a.75.75 0 0 0 .74 0l6.5-3.75a.75.75 0 0 0 0-1.3ZM8 1.602l4.995 2.883L8 7.368 3.005 4.485Zm-6.87 7.37 6.5 3.75a.75.75 0 0 0 .74 0l6.5-3.75a.75.75 0 0 0-.75-1.299L8 11.206 1.88 7.673a.75.75 0 1 0-.75 1.299Zm0 3.136 6.5 3.75a.75.75 0 0 0 .74 0l6.5-3.75a.75.75 0 0 0-.75-1.299L8 14.342l-6.12-3.533a.75.75 0 1 0-.75 1.299Z"
                        />
                    </svg>
                </span>
                <div class="title-copy">
                    <div class="title-line">
                        <h1>Aspire AppHosts</h1>
                        <span class="connection-dot" id="connection-dot" aria-hidden="true"></span>
                        <span class="sr-only" id="connection-status">Connecting to AppHost data</span>
                    </div>
                    <p id="app-subtitle">Discovering workspace AppHosts...</p>
                </div>
                <div class="mode-switch" role="group" aria-label="AppHost view mode">
                    <button class="mode-button is-active" id="workspace-mode" type="button" aria-pressed="true">Workspace</button>
                    <button class="mode-button" id="global-mode" type="button" aria-pressed="false">Global</button>
                </div>
                <button class="icon-button" id="refresh-button" type="button" aria-label="Refresh AppHosts" title="Refresh AppHosts">
                    <svg aria-hidden="true" width="15" height="15" viewBox="0 0 16 16">
                        <path
                            fill="currentColor"
                            d="M8 2.5a5.5 5.5 0 1 0 5.478 6.03.75.75 0 0 1 1.492.148A7 7 0 1 1 8 1c1.79 0 3.42.67 4.66 1.77V1.75a.75.75 0 0 1 1.5 0v3.5a.75.75 0 0 1-.75.75h-3.5a.75.75 0 0 1 0-1.5h1.72A5.48 5.48 0 0 0 8 2.5Z"
                        />
                    </svg>
                </button>
            </div>
            <div class="control-row">
                <label class="search-field">
                    <svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16">
                        <path
                            fill="currentColor"
                            d="M6.5 0a6.5 6.5 0 1 1-4.123 11.526l-2.157 2.157a.75.75 0 0 1-1.06-1.06l2.157-2.157A6.5 6.5 0 0 1 6.5 0Zm0 1.5a5 5 0 1 0 0 10 5 5 0 0 0 0-10Z"
                        />
                    </svg>
                    <span class="sr-only">Filter AppHosts and resources</span>
                    <input id="search-input" type="search" placeholder="Filter AppHosts and resources" autocomplete="off" />
                </label>
                <label class="hidden-toggle" title="Include resources hidden by the AppHost">
                    <input id="hidden-checkbox" type="checkbox" />
                    <span>Hidden resources</span>
                </label>
                <span class="freshness" id="freshness"></span>
            </div>
            <div class="progress-track" aria-hidden="true"><span></span></div>
        </header>

        <div class="status-banner" id="status-banner" role="status" hidden>
            <div>
                <strong id="status-title"></strong>
                <span id="status-message"></span>
            </div>
            <button class="button button-secondary button-small" id="status-action" type="button">Try again</button>
        </div>

        <main class="canvas-surface">
            <section class="loading-tree" id="loading-tree" aria-label="Loading AppHosts">
                <div class="skeleton skeleton-host"></div>
                <div class="skeleton-board">
                    <div class="skeleton skeleton-card"></div>
                    <div class="skeleton skeleton-card"></div>
                    <div class="skeleton skeleton-card"></div>
                </div>
            </section>

            <section class="empty-state" id="empty-state" hidden>
                <span class="empty-icon" aria-hidden="true">
                    <svg width="28" height="28" viewBox="0 0 16 16">
                        <path
                            fill="currentColor"
                            d="M1.75 1h4.5C7.216 1 8 1.784 8 2.75v4.5A1.75 1.75 0 0 1 6.25 9h-4.5A1.75 1.75 0 0 1 0 7.25v-4.5C0 1.784.784 1 1.75 1Zm8 0h4.5C15.216 1 16 1.784 16 2.75v4.5A1.75 1.75 0 0 1 14.25 9h-4.5A1.75 1.75 0 0 1 8 7.25v-4.5C8 1.784 8.784 1 9.75 1Zm-8 9h4.5C7.216 10 8 10.784 8 11.75v2.5A1.75 1.75 0 0 1 6.25 16h-4.5A1.75 1.75 0 0 1 0 14.25v-2.5C0 10.784.784 10 1.75 10Zm8 0h4.5c.966 0 1.75.784 1.75 1.75v2.5A1.75 1.75 0 0 1 14.25 16h-4.5A1.75 1.75 0 0 1 8 14.25v-2.5C8 10.784 8.784 10 9.75 10Z"
                        />
                    </svg>
                </span>
                <h2 id="empty-title">No AppHosts found</h2>
                <p id="empty-message"></p>
                <button class="button button-secondary" id="empty-action" type="button">Refresh</button>
            </section>

            <section class="model-view" id="model-view" aria-label="Aspire AppHosts" hidden></section>
        </main>

        <div class="action-menu" id="action-menu" role="menu" hidden></div>
        <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>

        <dialog class="operation-dialog" id="pipeline-dialog">
            <form method="dialog">
                <h2>Run pipeline step</h2>
                <p>Select a step exposed by this AppHost, or enter its name.</p>
                <label class="dialog-field">
                    <span>Pipeline step</span>
                    <input id="pipeline-step-input" list="pipeline-step-options" autocomplete="off" required />
                    <datalist id="pipeline-step-options"></datalist>
                </label>
                <p class="dialog-error" id="pipeline-error" hidden></p>
                <div class="dialog-actions">
                    <button class="button button-secondary" value="cancel">Cancel</button>
                    <button class="button button-primary" id="pipeline-run" value="run">Run step</button>
                </div>
            </form>
        </dialog>

        <script src="/app.js"></script>
    </body>
</html>
